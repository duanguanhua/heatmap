    }

    // ---- 分时/五日走势图（ECharts）----
    async function loadTrends(secid, elId, ndays) {
        // secid 优先取参数，其次根据面板类型从全局变量取最新值
        secid = getSecid(secid, elId);
        if (!secid) return
        const intraday = ndays === 1;
        elId = elId || (intraday ? 'chartIntraday' : 'chart5Day');
        const dom = document.getElementById(elId);
        const isRefresh = echInstances[elId] !== undefined;
        if (!isRefresh) {
            dom.innerHTML = '<div style="color:#888;text-align:center;padding:40px;font-size:13px;">加载中...</div>';
        }
        const upColor = '#ff3333', downColor = '#0aab62';
        try {
            const params = {
                secid: secid,
                ndays: ndays,
                fields1: 'f1,f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13,f14,f17,f16',
                fields2: 'f51,f53,f56,f58',
                iscr: '0',
                iscca: '0'
            };
            const json = await fetchJson(ndays === 1 ? TRENDS_DELAY_URL : TRENDS_HIS_URL, params, 30000, 2);
            const trends = json?.data?.trends || [];
            const tradePeriods = json?.data?.tradePeriods || {};
            const periods = tradePeriods.periods || [];
            if (!trends.length) {
                dom.innerHTML = `<div style="color:#666;text-align:center;padding:40px;">暂无${intraday ? '当日' : '五日'}数据</div>`;
                return;
            }

            let rawRows = [], times = [], prices = [], vols = [], avgs = [];
            let displayTimesForAxis = [];
            let markLineData = [];

            let fmtAxis, fmtVal;
            if (intraday) {
                const todayTrends = [];
                for (const t of trends) {
                    const parts = t.split(',');
                    if (parts.length < 4) continue;
                    todayTrends.push(parts);
                }

                const displayTimes = periods.length ? generateFullDayTimeSlots(periods) : [];
                const timeDataMap = new Map();
                for (const parts of todayTrends) {
                    const timeOnly = parts[0].split(' ')[1]?.slice(0, 5);
                    if (timeOnly) {
                        timeDataMap.set(timeOnly, parts);
                    }
                }

                if (displayTimes.length > 0) {
                    for (const t of displayTimes) {
                        const parts = timeDataMap.get(t);
                        if (parts) {
                            rawRows.push(parts);
                            times.push(parts[0]);
                            let price = Number(parts[1]);
                            let vol = Number(parts[2]);
                            let avg = Number(parts[3]);
                            if (avg === 0) avg = null;
                            prices.push(price);
                            vols.push(vol);
                            avgs.push(avg);
                        } else {
                            rawRows.push(null);
                            times.push(t);
                            prices.push(null);
                            vols.push(null);
                            avgs.push(null);
                        }
                    }
                } else {
                    for (const parts of todayTrends) {
                        rawRows.push(parts);
                        times.push(parts[0]);
                        prices.push(Number(parts[1]));
                        vols.push(Number(parts[2]));
                        avgs.push(Number(parts[3]));
                    }
                }

                displayTimesForAxis = displayTimes.length > 0 ? displayTimes : times.map(t => {
                    const parts = t.split(' ');
                    return parts[1] || parts[0];
                });
                const [markTimes, markMap] = getMinuTimeAxis(displayTimesForAxis);
                fmtAxis = v => markMap[v] || v;
                fmtVal = (v, idx) => {
                    return markTimes.includes(displayTimesForAxis[idx]);
                };
                markLineData = markTimes.map(t => ({xAxis: t}));
            } else {
                const dateLabels = [];
                let lastDate = '', lastDateLabel = '';

                // 遍历所有trends数据点
                for (const t of trends) {
                    const parts = t.split(',');
                    if (parts.length < 4) continue;
                    const fullTime = parts[0];
                    const datePart = fullTime.split(' ')[0];
                    let xLabel = fullTime.split(' ')[1]?.slice(0, 5);
                    if (datePart !== lastDate) {
                        lastDateLabel = datePart.length === 8 ? datePart.slice(4, 6) + '-' + datePart.slice(6, 8) : datePart.slice(5);
                        xLabel = lastDateLabel;
                        lastDate = datePart;
                    }

                    rawRows.push(parts);
                    times.push(xLabel);
                    dateLabels.push(lastDateLabel);
                    let price = Number(parts[1]);
                    let vol = Number(parts[2]);
                    let avg = Number(parts[3]);
                    if (avg === 0) avg = null;
                    prices.push(price);
                    vols.push(vol);
                    avgs.push(avg);
                }

                // 获取最后一个有数据的时间
                let lastDataTime = null;
                if (trends.length > 0) {
                    lastDataTime = trends[trends.length - 1].split(',')[0].split(' ')[1]?.slice(0, 5);
                }

                // 生成最后一天的时间轴
                const lastDayTimeSlots = generateFullDayTimeSlots(periods);

                // 遍历最后一天时间轴，匹配到最后一个有数据时间时，将剩余时间点全部加入
                if (lastDayTimeSlots.length > 0 && lastDataTime) {
                    let matched = false;
                    for (const t of lastDayTimeSlots) {
                        if (t === lastDataTime) {
                            matched = true;
                        }
                        if (matched) {
                            rawRows.push(null);
                            times.push(t);
                            prices.push(null);
                            vols.push(null);
                            avgs.push(null);
                        }
                    }
                }

                displayTimesForAxis = times;

                // 五日均分成5份，6条分隔线
                const totalPoints = times.length;
                const sectionBoundaries = [];
                for (let i = 0; i <= 5; i++) {
                    const idx = Math.round(i * (totalPoints - 1) / 5);
                    markLineData.push({xAxis: idx});
                    sectionBoundaries.push(idx);
                }

                const sectionMidIndices = [];
                for (let i = 0; i < 5; i++) {
                    sectionMidIndices.push(Math.round(sectionBoundaries[i]));
                }
                const midLabelIndexSet = new Set(sectionMidIndices);
                fmtAxis = (v, idx) => midLabelIndexSet.has(idx) ? (dateLabels[idx] || '') : '';
                fmtVal = function (idx) {
                    return midLabelIndexSet.has(idx);
                };
            }

            const hisPrePrices = json?.data?.hisPrePrices
            const preClose = (hisPrePrices && hisPrePrices.length > 0 ? hisPrePrices[0].prePrice : prices[0]) || json?.data?.prePrice || prices[0];

            // 计算Y轴范围
            const validPrices = prices.filter(p => p !== null);
            const validAvgs = avgs.filter(a => a !== null && !isNaN(a));
            const allYValues = [...validPrices, ...validAvgs];
            const amp = (() => {
                if (allYValues.length === 0) return 0.05;
                const maxUp = Math.abs((Math.max(...allYValues) - preClose) / preClose);
                const maxDown = Math.abs((Math.min(...allYValues) - preClose) / preClose);
                const maxAmp = Math.max(maxUp, maxDown, 0.005);
                return Math.max(maxAmp, 0.01);
            })();

            // 保持对称
            const yMin = preClose * (1 - amp);
            const yMax = preClose * (1 + amp);
            // 上半 四分

    /**
     * 获取基金净值数据并进行复权处理
     * @param {string} secid 证券ID，格式如 "1.600036"
     * @returns {Array|null} 净值数据列表，每项包含 FSRQ(日期) 和 DWJZ(复权后净值)
     */
    async function getNavData(secid) {
        let navData = null;
        try {
            // 请求天天基金网获取基金净值数据
            const params = {
                product: 'EFund',
                FCODE: secid.split('.')[1],
                RANGE: 'ln'
            };
            const json = await fetchJson(IOPV_URL, params);
            navData = json?.data || null;

            // expansion 包含基金拆分、分红等扩展信息
            const expansion = json?.expansion || [];
            const dataList = Array.isArray(navData) ? navData : [];

            // 构建日期 -> 净值的映射，便于快速查找
            const dateNavMap = new Map();
            dataList.forEach(d => dateNavMap.set(d.FSRQ, d.DWJZ));

            // 获取所有日期并排序（升序），用于后续查找前后交易日
            const allDates = Array.from(dateNavMap.keys()).sort();

            // 收集所有拆分登记日（STYPE=100 表示拆分），并按日期升序排列
            const splitRegDates = expansion
                .filter(item => item.STYPE === "100" && item.FSRQ)
                .map(item => item.FSRQ)
                .sort();

            const splitMap = new Map();

            for (const regDate of splitRegDates) {
                const regNavStr = dateNavMap.get(regDate);
                if (!regNavStr) continue;

                const regIdx = allDates.findIndex(d => d === regDate);
                if (regIdx <= 0) continue;

                const preDate = allDates[regIdx - 1];
                const preNavStr = dateNavMap.get(preDate);
                const preNav = parseFloat(preNavStr);
                const regNav = parseFloat(regNavStr);
                if (regNav <= 0) continue;

                const ratio = Math.round(preNav / regNav) || 1;
                splitMap.set(regDate, ratio);
            }

            if (dataList.length && splitMap.size) {
                // 时间降序排序
                dataList.sort((a, b) => b.FSRQ.localeCompare(a.FSRQ));
                let cumRatio = 1;
                for (const item of dataList) {
                    const nav = parseFloat(item.DWJZ) || 0;
                    item.DWJZ = (nav / cumRatio).toFixed(4);
                    const ratio = splitMap.get(item.FSRQ);
                    if (ratio) cumRatio *= ratio;
                }
            }
        } catch (e) {
            console.error('获取基金净值数据失败:', e);
        }

        return navData;
    }

    async function loadKline(klt, fetchLmt, elId, secid, infoElId) {
        secid = getSecid(secid, elId);
        if (!secid) return
        elId = elId || 'chartKline';
        const dom = document.getElementById(elId);
        const isRefresh = echInstances[elId] !== undefined;
        if (!isRefresh) {
            dom.innerHTML = '<div style="color:#888;text-align:center;padding:40px;font-size:13px;">加载中...</div>';
        }
        const infoEl = infoElId ? document.getElementById(infoElId) : null;
        if (infoEl) infoEl.innerHTML = '';
        const upColor = '#f23636', downColor = '#00b38a';

        const end = new Date().toISOString().slice(0, 10).replace(/-/g, '');

        // 带回退的 K 线获取：东财直连（degrade=2 网络错误自动降级到 playwright 代理）
        // 业务层额外处理：直连返回了 HTTP 200 但 klines 为空时，也走代理再试一次
        async function fetchKlines(lmt) {
            const params = {
                secid: secid,
                klt: klt,
                fqt: 1,
                end: end,
                iscca: 1,
                fields1: 'f1,f2,f3,f4,f5',
                fields2: 'f51,f52,f53,f54,f55,f56,f57,f58,f59',
                ut: 'f057cbcbce2a86e2866ab8877db1d059',
                forcect: 1,
                lmt: lmt
            };

            // 直连 + degrade=2 网络错误自动降级到 playwright 代理
            try {
                const json = await fetchJson(KLINE_URL, params, 30000, 2);
                if (json?.data?.klines?.length) {
                    return {
                        klines: json.data.klines,
                        dktotal: json.data.dktotal || 0
                    };
                }
            } catch (e) {
                console.warn('直连+自动降级仍未拿到K线:', e.message);
            }

            throw new Error('所有数据源均未返回K线数据');
        }

        const maDays = [5, 10, 30, 60];
        const maColors = ['#faa90e', '#8400ff', '#416df9', '#001953'];

        // 根据 K 线数组生成 ECharts 完整配置
        function buildOption(klineArr, navData) {
            // splitData 一次性完成切分，并返回 raws 供本函数复用，避免对每个字符串重复 split
            const klineData = splitData(klineArr);
            const rawSplits = klineData.raws;

            // 命名字段的 K 线数据数组，避免数组索引混乱
            // API 返回字段顺序：日期(f51),开盘(f52),收盘(f53),最高(f54),最低(f55),成交量(f56),成交额(f57),振幅(f58),涨跌幅(f59)
            const klineItems = rawSplits.map(parts => ({
                date: parts[0],
                open: Number(parts[1]),
                close: Number(parts[2]),
                high: Number(parts[3]),
                low: Number(parts[4]),
                volume: Number(parts[5]),
                amount: Number(parts[6]),
                amplitude: Number(parts[7]),
                changePct: Number(parts[8])
            }));

            let has_nav = false
            if (navData) {
                const navMap = {};
                navData.forEach(item => {
                    navMap[item.FSRQ] = {
                        nav: parseFloat(item.DWJZ),
                        navChange: parseFloat(item.JZZZL)
                    };
                });

                // 交易日且接口未返回当日净值 → 用 ULIST 行情（IOPV + q.premium）直接填当日 K 线，不污染 navData
                const today = formatDate(new Date());
                let todayQuote = null;
                let lastNav = NaN;
                if (isTradingDay() && !navMap[today] && navData.length) {
                    const q = quoteMap.get(secid);
                    if (!isNaN(q?.iopv)) {
                        todayQuote = q;
                        lastNav = Number(navData.at(-1).DWJZ);
                    }
                }

                klineItems.forEach(k => {
                    const info = navMap[k.date];
                    if (info) {
                        k.nav = info.nav;
                        k.navChange = info.navChange;
                        k.premium = k.nav && k.nav !== 0 ? ((k.close - k.nav) * 100 / k.nav).toFixed(2) : null;
                    } else if (todayQuote && k.date === today) {
                        // 当日净值接口没返回 → 直接用 IOPV 作净值、q.premium 作溢价，更准确高效
                        const iopv = Number(todayQuote.iopv);
                        k.nav = iopv;
                        k.navChange = (!isNaN(lastNav) && lastNav > 0)
                            ? parseFloat(((iopv - lastNav) / lastNav * 100).toFixed(2))
                            : null;
                        k.premium = -todayQuote.premium?.toFixed(2) || null;
                    }
                });
                has_nav = true;
            }

            const maData = {};
            maDays.forEach((d, i) => {
                maData['MA' + d] = {data: calculateMA(d, klineData), color: maColors[i]};
            });

            // 计算 MACD

            // 提取所有价格数据用于自适应Y轴小数位数

                        // },

                    formatter: function (params) {
                        // 找到 candlestick 数据项，用 dataIndex 从 klineItems 读取命名字段
                        let cs = null;
                        if (params[0] && params[0].componentSubType === 'candlestick') cs = params[0];
                        else if (params[1] && params[1].componentSubType === 'candlestick') cs = params[1];
                        if (!cs) return '';
                        const idx = cs.dataIndex;
                        const item = klineItems[idx];
                        if (!item) return '';
                        const {open, close, high, low, volume, amount, changePct} = item;

                        // 至今涨幅：从该日前一交易日收盘到最后一根K线的收盘
                        let cumulativePct = 0;
                        if (idx !== 0) {
                            const prevClose = klineItems[idx - 1].close;
                            const lastClose = klineItems[klineItems.length - 1].close;
                            cumulativePct = ((lastClose - prevClose) / prevClose * 100);
                        }

                        const emphasize = `font-weight:500;font-size:13.5px;color:${changePct >= 0 ? upColor : downColor}`;
                        const emphasizeCum = `font-weight:500;font-size:13.5px;color:${cumulativePct >= 0 ? upColor : downColor}`;
                        let html = tipRow('时间', item.date)
                            + tipRow('涨跌幅', fmtPct2(changePct), emphasize)
                            + tipRow('至今涨幅', fmtPct2(cumulativePct), emphasizeCum)
                            + tipRow('开盘', open)
                            + tipRow('收盘', close)
                            + tipRow('最高', high)
                            + tipRow('最低', low);

                        if (has_nav) {
                            let navHtml = '';

                                const c2 = item.premium >= 0 ? upColor : downColor;
                                let s2 = (item.premium > 0 ? '+' : '') + item.premium + '%';
                                navHtml =
                                    tipRow('净值', fmtPrice(item.nav))
                                    + tipRow('净值涨幅', s1, `font-weight:500;font-size:13.5px;color:${c1}`)
                                    + tipRow('溢价', s2, `font-weight:500;font-size:13.5px;color:${c2}`);
                            } else {
                                navHtml =

                                    + tipRow('净值涨幅', '--')
                                    + tipRow('溢价', '--');
                            }
                            html += navHtml;

                        // MA 值
                        maDays.forEach(d => {
                            const v = maData['MA' + d].data[idx];
                            if (v !== '-' && v != null) {
                                html += tipRow(`MA${d}`, Number(v).toFixed(2));
                            }
                        });

                        // MACD 指标
                        if (macdResult.macd[idx] != null) {
                            html += tipRow('MACD', macdResult.macd[idx].toFixed(3));

        try {
            const initialLmt = fetchLmt || 400;
            const {klines, dktotal} = await fetchKlines(initialLmt);

            if (!klines.length) {
                dom.innerHTML = '<div style="color:#666;text-align:center;padding:40px;">暂无K线数据</div>';
                return;
            }

            let navData = elId === 'chartKlineDay' ? await getNavData(secid) : null;

            const inst = initECharts(elId, true);
            if (!inst) return;

            // ✅ 每个图表实例挂一个状态对象（关键）
            if (!inst._state) {
                inst._state = {
                    fullFetched: false,
                    currentLimit: initialLmt,
                    dataZoom: null
                };
            }
            const state = inst._state;
            inst.setOption(buildOption(klines, navData), true);

            // ✅ 保存当前 dataZoom 状态
            const dz = inst.getOption().dataZoom;
            state.dataZoom = {
                start: dz[0].start,
                end: dz[0].end
            };

            // ✅ 实时同步用户拖拽/缩放
            if (!inst._dzListener) {
                inst._dzListener = true;
                inst.on('datazoom', (params) => {
                    const batch = params?.batch?.[0] || params || {};
                    const dzOpt = inst.getOption().dataZoom[0];
                    state.dataZoom = {
                        start: Number(batch.start ?? dzOpt.start),
                        end: Number(batch.end ?? dzOpt.end)
                    };
                });
            }

            startChartRefresh({
                elId: elId,
                secid: secid,
                // secid 传 undefined，由 loadKline 内部根据 elId 动态获取最新 secid
                fn: () => loadKline(klt, state.currentLimit, elId, undefined, infoElId)
            });

            // 仅当已加载数据少于服务端全量时，才监听首次 datazoom 触发全量加载
            if (klines.length < dktotal) {
                let fullFetched = false;
                const handler = async (params) => {
                    if (fullFetched) return;
                    fullFetched = true;
                    state.currentLimit = dktotal;   // ✅ 刷新时就会用全量
                    inst.off('datazoom', handler);

                    // 记录当前可见时间范围（基于已加载 klines）
                    const batch = params?.batch?.[0] || params || {};
                    const dzOpt = inst.getOption().dataZoom[0];
                    const startPct = Number(batch.start ?? dzOpt.start);
                    const endPct = Number(batch.end ?? dzOpt.end);
                    const oldTotal = klines.length;
                    const oldStartIdx = Math.max(0, Math.floor(startPct / 100 * oldTotal));
                    const oldEndIdx = Math.min(oldTotal - 1, Math.ceil(endPct / 100 * oldTotal));
                    const startDate = klines[oldStartIdx]?.split(',')[0];
                    const endDate = klines[oldEndIdx]?.split(',')[0];

                    // 加载提示
                    const tip = document.createElement('div');
                    tip.style.cssText = 'position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:4px;font-size:12px;z-index:10;pointer-events:none;';
                    tip.textContent = '加载历史数据...';
                    dom.style.position = 'relative';
                    dom.appendChild(tip);

                    try {
                        const full = await fetchKlines(dktotal);
                        if (!full.klines.length) return;
                        inst.setOption(buildOption(full.klines, navData), true);

                        // 保持可见时间范围
                        const newTotal = full.klines.length;
                        const newStartIdx = full.klines.findIndex(k => k.split(',')[0] === startDate);
                        const newEndIdx = full.klines.findIndex(k => k.split(',')[0] === endDate);
                        const newStartPct = newStartIdx >= 0 ? (newStartIdx / newTotal * 100) : 0;
                        const newEndPct = newEndIdx >= 0 ? ((newEndIdx + 1) / newTotal * 100) : 100;

                        // ✅ 写回 state
                        state.dataZoom = {start: newStartPct, end: newEndPct};
                        inst.setOption({
                            dataZoom: [
                                {start: newStartPct, end: newEndPct},
                                {start: newStartPct, end: newEndPct}
                            ]
                        });
                    } catch (e) {
                        console.error('K线全量加载失败:', e);
                    } finally {
                        tip.remove();
                    }
                };
                inst.on('datazoom', handler);
            }
            // ✅ 刷新 / 重算后，强制还原 dataZoom
            if (state.dataZoom) {
                inst.setOption({
                    dataZoom: [
                        {start: state.dataZoom.start, end: state.dataZoom.end},
                        {start: state.dataZoom.start, end: state.dataZoom.end}
                    ]
                }, false);
            }

        } catch (e) {
            dom.innerHTML = `<div style="color:#c0392b;text-align:center;padding:40px;">K线加载失败: ${e.message}</div>`;
        }
    }

    function filterEtfData(source, maxCount) {
        let filtered = source.filter(d => {
            if (etfSortField === '总市值') {
                return d.总市值 > 0;
            }
            return d.成交额 > 0;
        });
        if (searchTerm) {
            const s = searchTerm.toLowerCase();
            filtered = filtered.filter(d => (d.代码 || '').includes(s) || (d.名称 || '').toLowerCase().includes(s));
        }
        const sortField = etfSortField;
        filtered = filtered.sort((a, b) => (b[sortField] || 0) - (a[sortField] || 0)).slice(0, maxCount);
        const stats = computeStats(filtered, etfSortField);
        return {filtered, stats, sortField};
    }

    /* ======================== 公共汇总/工具 ======================== */
    // 单次遍历统计涨/跌/平计数（替代各渲染函数内重复的多分支遍历）
    function countUpDown(items, valueFn) {
        let rise = 0, fall = 0, flat = 0;
        for (const it of items) {
            const v = valueFn(it);
            if (v > 0) rise++;
            else if (v < 0) fall++;
            else if (v === 0) flat++;
        }
        return {rise, fall, flat};
    }

    // 加权平均：sum(value * weight) / sum(weight)，权重和<=0 时返回 fallback
    function weightedAvg(items, valueFn, weightFn, fallback = 0) {
        let num = 0, den = 0;
        for (const it of items) {
            const w = weightFn(it) || 0;
            num += valueFn(it) * w;
            den += w;
        }
        return den > 0 ? num / den : fallback;
    }

        inst.on('click', function (params) {

    }

    /* ======================== 图表1：ETF热力图（Treemap） ======================== */
    // 按指数去重后（每指数保留市值最大的一只），以成交额/总市值为方块大小，涨跌幅为颜色
    function renderEtfTreemap(rule) {
        const temp = (rule === 'all' ? dedupData : dedupData.filter(d => d.交易规则 === rule));
        const source = temp.filter(d => containLOF || d.名称.includes('ETF'));

        const ranked = filtered.filter(d => !isNaN(d.涨跌幅))
            .sort((a, b) => b.涨跌幅 - a.涨跌幅);
        let displayText = statsText(stats);
        displayText = enrichStatsWithSectors(displayText, ranked.map(d => ({
            name: d.名称, value: d.涨跌幅, amount: d[sortField] || 0
        })), 20, SECTOR_KEYWORDS);
        document.getElementById('statsBar').innerHTML = displayText.join('');

        // 单次遍历汇总：总市值/总成交额（涨跌平计数由 countUpDown 统一计算）

        const rootBg = getTreemapColor(stats.avg);
        const option = {
            backgroundColor: '#141414',
            tooltip: {
                ...ECH_TOOLTIP,

                    const d = params.data && params.data._itemData;
                    if (d) {

                    }
                    return `<b>ETF 全览</b> ${avgStr}<br>` +
                        `<span style="color:#e74c3c;">↑${riseRoot}涨</span>
                         <span style="color:#2ecc71;">↓${fallRoot}跌</span>
                         <span style="color:#888;">${flatRoot}平</span> | 共${filtered.length}只<br>` +

                textStyle: {color: '#ccc', fontSize: 11},
                text: ['涨', '跌'],
                calculable: true,
                right: 15,

            },
            series: [{

                    name: 'ETF',
                    value: [totalAll / 1e8, stats.avg],
                    label: {
                        show: true,

    /* ======================== 图表2：指数热力图（Treemap层级） ======================== */
    // 三层树图：根(ETF) -> 指数(按分组加权) -> 具体ETF（每指数取Top 8），展示指数内ETF数量及涨跌分布
    function renderIndexTreemap(rule) {
        let temp = (rule === 'all' ? allData : allData.filter(d => d.交易规则 === rule));
        const source = temp.filter(d => containLOF || d.名称.includes('ETF'));
        let {filtered, stats, sortField} = filterEtfData(source, source.length);
        filtered = filtered.map(d => Object.assign({}, d, {指数名称: (d.指数名称 || '').trim() || 'LOF'}));

        const groups = {};
        for (const d of filtered) {
            const idx = d.指数名称;
            (groups[idx] = groups[idx] || []).push(d);
        }
        const indexStats = Object.entries(groups).map(([idx, items]) => {
            const total = items.reduce((s, d) => s + (d[sortField] || 0), 0);
            const weighted = weightedAvg(items, d => d.涨跌幅, d => d[sortField] || 0);
            return {index: idx, weighted, total, count: items.length, items};
        });

        // 提取前10/后10指数的高频行业关键词
        const ranked = indexStats.filter(s => s.count > 0 && !isNaN(s.weighted))
            .sort((a, b) => b.weighted - a.weighted);
        let sbText = statsText(stats, filtered.length);
        sbText = enrichStatsWithSectors(sbText, ranked.map(s => ({
            name: s.index, value: s.weighted, amount: s.total
        })), 10, SECTOR_KEYWORDS);
        document.getElementById('statsBar').innerHTML = sbText.join('');

        // 单次遍历汇总：filtered 的总额与 indexStats 的涨跌平计数
        let totalAll = 0, rootAmt = 0, rootMcap = 0;
        for (const d of filtered) {
            totalAll += (d[sortField] || 0);
            rootAmt += (d.成交额 || 0);
            rootMcap += (d.总市值 || 0);
        }
        const {rise: rootRise, fall: rootFall, flat: rootFlat} = countUpDown(indexStats, s => s.weighted);
        const avgStr = fmtPct(stats.avg);

        const rootBg = getTreemapColor(stats.avg);
        const indexChildren = [];

        for (const st of indexStats) {
            const items = st.items;
            // 单次遍历汇总：总市值、总成交额
            let totalMcap = 0, totalAmt = 0;
            for (const d of items) {
                totalMcap += (d.总市值 || 0);
                totalAmt += (d.成交额 || 0);
            }
            // 加权换手率 / 加权折价率（按 sortField 权重）
            const wTurnover = weightedAvg(items, d => d.换手率 || 0, d => d[sortField] || 0, NaN);
            const wDiscount = weightedAvg(items, d => d.折价率 || 0, d => d[sortField] || 0, NaN);

            const idxPct = fmtPct(st.weighted);
            const idxHover = `<b>${st.index}</b> ${idxPct}<br>` +
                `${items.length}只ETF | 成交额: ${fmtAmount(totalAmt)} | 总市值: ${fmtAmount(totalMcap)}<br>` +
                `换手: ${fmtPct(wTurnover)} | 溢价: ${!isNaN(wDiscount) ? fmtPct(-wDiscount) : '--'}`;

            const idxBg = getTreemapColor(st.weighted);
            const etfChildren = [];
            const top = st.items.sort((a, b) => (b[sortField] || 0) - (a[sortField] || 0));
            for (const e of top) {
                const chg = (e.涨跌幅 == null || isNaN(e.涨跌幅)) ? 0 : e.涨跌幅;
                const bg = getTreemapColor(chg);
                const pct = fmtPct2(e.涨跌幅);
                const amtText = fmtAmount(e[sortField] || 0);
                etfChildren.push({
                    name: e.名称,
                    value: [(e[sortField] || 0) / 1e8, chg],
                    itemStyle: {color: bg},
                    _itemData: e,
                    code: e.代码,
                    label: {
                        show: true,
                        formatter: `{name|${e.名称}}\n{code|${e.代码}}\n{pct|${pct}}\n{amt|${amtText}}`,
                        rich: {
                            name: {
                                color: getContrastText(bg),
                                fontSize: 11,
                                lineHeight: 15,
                                overflow: 'truncate',
                                ellipsis: '..'
                            },
                            code: {color: getContrastText(bg), fontSize: 10, lineHeight: 12},
                            pct: {color: getContrastText(bg), fontSize: 10, lineHeight: 13},
                            amt: {color: getContrastText(bg), fontSize: 9, lineHeight: 12, opacity: 0.85}
                        }
                    },
                    _hoverText: buildEtfHoverText(e)
                });
            }

            const idxName = truncLabel(st.index);
            const idxAmtText = fmtAmount(st.total);
            indexChildren.push({
                name: `${idxName} ${idxPct}`,
                value: [st.total / 1e8, st.weighted],
                itemStyle: {borderColor: idxBg},
                label: {
                    show: true,
                    formatter: `${idxName} ${idxPct} | ${idxAmtText}`,
                    rich: {
                        name: {
                            color: getContrastText(idxBg),
                            fontSize: 12,
                            fontWeight: 'bold',
                            lineHeight: 16,
                            overflow: 'truncate',
                            ellipsis: '..'
                        },
                        pct: {color: getContrastText(idxBg), fontSize: 11, lineHeight: 14},
                        amt: {color: getContrastText(idxBg), fontSize: 10, lineHeight: 12, opacity: 0.85}
                    }
                },
                _hoverText: idxHover,
                children: etfChildren
            });
        }

        const option = {
            backgroundColor: '#141414',
            tooltip: {
                ...ECH_TOOLTIP,
                formatter: function (params) {
                    if (params.data && params.data._hoverText) {
                        return params.data._hoverText;
                    }
                    if (params.data && params.data._itemData) {
                        return buildEtfHoverText(params.data._itemData);
                    }
                    return `<b>ETF 全览</b> ${avgStr}<br>` +
                        `<span style="color:#e74c3c;">↑${rootRise}涨</span>
                         <span style="color:#2ecc71;">↓${rootFall}跌</span>
                         <span style="color:#888;">${rootFlat}平</span>
                        | ${filtered.length}只ETF | ${indexStats.length}指数<br>` +
                        `成交额: ${fmtAmount(rootAmt)} | 总市值: ${fmtAmount(rootMcap)}`;
                }
            },
            visualMap: {
                show: true,
                type: 'continuous',
                min: COLOR_SCALE_ABS[0],
                max: COLOR_SCALE_ABS[1],
                inRange: {color: VISUAL_MAP_COLORS},
                textStyle: {color: '#ccc', fontSize: 11},
                text: ['涨', '跌'],
                calculable: true,
                right: 15,
                top: 'center',
                width: 8,
                height: '80%'
            },
            series: [{
                type: 'treemap',
                name: 'ETF',
                visualDimension: 1,
                nodeClick: false,
                roam: true,
                zoomToNode: false,
                breadcrumb: {show: false},
                data: [{
                    name: 'ETF',
                    value: [totalAll / 1e8, stats.avg],
                    label: {
                        show: true,
                        formatter: `ETF\n${avgStr}\n${fmtAmount(totalAll)}`,
                        color: getContrastText(rootBg),
                        fontSize: 14,
                        fontWeight: 'bold'
                    },
                    children: indexChildren
                }],
                itemStyle: {borderColor: '#141414', borderWidth: 0, gapWidth: 2},
                levels: [{
                    // 根(ETF)
                    itemStyle: {borderColor: '#141414', borderWidth: 0, gapWidth: 0},
                    label: {show: true},
                    upperLabel: {show: false}
                }, {
                    // 指数
                    itemStyle: {borderColor: '#333', borderWidth: 1, gapWidth: 1.5},
                    label: {show: true},
                    upperLabel: {show: false}
                }, {
                    // 具体ETF
                    itemStyle: {borderColor: '#222', borderWidth: 0.5, gapWidth: 1},
                    label: {show: true},
                    upperLabel: {show: true, color: '#333'}
                }]
            }]
        };

        const inst = initECharts('chart', true);
        if (!inst) return;
        inst.setOption(option);
        // 实例被复用，先解除旧点击绑定，避免重复监听叠加
        inst.off('click');
        inst.on('click', function (params) {
            const name = params.name || (params.data && params.data.name);
            if (!name || name === 'ETF') return;
            const item = params.data && params.data._itemData;
            if (item) {
                openDetail(item);
            } else {
                // 取子集里的第一个 打开指数弹框
                const children = params.data && params.data.children;
                if (children && children.length > 0) {
                    const firstChild = children[0];
                    const childItem = firstChild && firstChild._itemData;
                    if (childItem) openIndexPanel(childItem.指数代码);
                }
            }
        });
        // #chart 容器级点击监听只需绑定一次（阻止冒泡到全局空白关闭）
        bindChartDomClickOnce();
        scheduleResize('chart');
    }

    /* ======================== 图表3 图表4：周期热力图（Heatmap） ======================== */
    // 指数周期：按指数分组，成交额加权平均各周期涨跌幅；ETF周期：每行一只ETF。Top40 × 7周期，每列独立归一化
    function buildPeriodMatrix(rule, containLOF, sortCol, asc, mode) {
        const cacheKey = `${mode}|${rule}|${containLOF}|${sortCol}|${asc ? 1 : 0}|${searchTerm}`;
        if (periodRawCache[cacheKey]) return periodRawCache[cacheKey];
        const dataPool = mode === 'etf' ? dedupData : allData;
        const temp = (rule === 'all' ? dataPool : dataPool.filter(d => d.交易规则 === rule));
        // 周期热力图只与涨跌幅有关，与成交量/市值无关：仅按 LOF 开关过滤（数据本身自带涨幅）
        let filtered = containLOF ? temp : temp.filter(d => d.名称.includes('ETF'));
        // 搜索过滤
        if (searchTerm) {
            const s = searchTerm.toLowerCase();
            filtered = filtered.filter(d => (d.代码 || '').includes(s) || (d.名称 || '').toLowerCase().includes(s));
        }
        let matrixRows;
        if (mode === 'etf') {
            // ETF周期：每行一只ETF（保留原始字段供 openDetail 使用）
            matrixRows = filtered.map(d => {
                const row = Object.assign({}, d);
                row.成交额 = d.成交额 || 0;
                for (const col of PERIOD_COLS) {
                    const dataField = col === '今天' ? TODAY_FIELD : col;
                    row[col] = d[dataField];
                }
                return row;
            });
        } else {
            // 指数周期：按指数分组，成交额加权平均各周期涨跌幅
            const grouped = filtered.map(d => Object.assign({}, d, {指数名称: (d.指数名称 || '').trim() || '其他'}));
            const groups = {};
            for (const d of grouped) {
                const idx = d.指数名称;
                const indexCode = d.指数代码;
                (groups[idx] = groups[idx] || {items: [], total: 0, indexCode: indexCode, code: d.代码});
                groups[idx].items.push(d);
                groups[idx].total += (d.成交额 || 0);
            }
            matrixRows = Object.entries(groups).map(([idx, g]) => {
                const items = g.items;
                const row = {
                    指数名称: idx,
                    指数代码: g.indexCode,
                    成交额: g.total,
                    ETF数量: items.length,
                    ETF列表: items
                };
                // ETF数量>2时取总市值前2名作为代表
                if (items.length > 2) {
                    const sorted = [...items].sort((a, b) => (b.总市值 || 0) - (a.总市值 || 0));
                    row.代表ETF = sorted.slice(0, 2).map(d => d.名称 + '(' + d.代码 + ')\n');
                } else {
                    row.代表ETF = items.map(d => d.名称 + '(' + d.代码 + ')');
                }
                // 指数参考涨幅：按市值加权平均（市值合计为0时退化等权），作为对比基准
                for (const col of PERIOD_COLS) {
                    const dataField = col === '今天' ? TODAY_FIELD : col;
                    const valid = g.items.filter(d => d[dataField] != null && !isNaN(d[dataField]));
                    if (valid.length === 0) {
                        row[col] = NaN;
                        continue;
                    }
                    const mcap = valid.reduce((s, d) => s + (d.总市值 || 0), 0);
                    row[col] = mcap > 0
                        ? valid.reduce((s, d) => s + d[dataField] * (d.总市值 || 0), 0) / mcap
                        : valid.reduce((s, d) => s + d[dataField], 0) / valid.length;
                }
                return row;
            });
        }
        // 按当前排序列降序，NaN放最后，取Top40
        matrixRows.sort((a, b) => {
            const va = a[sortCol], vb = b[sortCol];
            if (isNaN(va) && isNaN(vb)) return 0;
            if (isNaN(va)) return 1;
            if (isNaN(vb)) return -1;
            return vb - va;
        });
        // matrixRows 已按 sortCol 降序排列，直接复用提取 top10/bottom10 关键词
        const nameField = mode === 'etf' ? '名称' : '指数名称';
        const sortedForStats = matrixRows;
        const fullHead10 = sortedForStats.slice(0, 10).map(r => ({
            name: r[nameField],
            value: r[sortCol],
            amount: r.成交额 || 0
        }));
        const fullTail10 = sortedForStats.slice(-10).map(r => ({
            name: r[nameField],
            value: r[sortCol],
            amount: r.成交额 || 0
        }));
        const strongKwsFull = extractKeywords(fullHead10.filter(d => !isNaN(d.value)), SECTOR_KEYWORDS)
            .sort((a, b) => a.avg - b.avg);
        const weakKwsFull = extractKeywords(fullTail10.filter(d => !isNaN(d.value)), SECTOR_KEYWORDS)
            .sort((a, b) => a.avg - b.avg);

        // 降序已排好；取Top40（强势）或 Bottom40（弱势）
        const top = asc ? matrixRows.slice(-40).reverse() : matrixRows.slice(0, 40);

        periodRawCache[cacheKey] = {top, strongKwsFull, weakKwsFull};
        return periodRawCache[cacheKey];
    }

    // 截断名称：超过最大长度则取前N个字符 + ...
    function truncLabel(name) {
        if (!name) return '';
        return name.length > MAX_PERIOD_LABEL_LEN ? name.slice(0, MAX_PERIOD_LABEL_LEN) + '...' : name;
    }

    function renderPeriodHeatmap(rule, containLOF, mode) {
        const cache = buildPeriodMatrix(rule, containLOF, periodSortCol, periodSortAsc, mode);
        const {top, strongKwsFull, weakKwsFull} = cache;
        const isEtf = mode === 'etf';
        const nameField = isEtf ? '名称' : '指数名称';

        // ---------- 统计栏（基于实际展示的Top40，与热力图口径一致） ----------
        const validRows = top.filter(r => r[periodSortCol] != null && !isNaN(r[periodSortCol]));
        let rise = 0, fall = 0, flat = 0;
        for (const r of validRows) {
            const v = r[periodSortCol];
            if (v > 0) rise++;
            else if (v < 0) fall++;
            else if (v === 0) flat++;
        }

        const vals = validRows.map(r => r[periodSortCol]).sort((a, b) => a - b);
        const avgRaw = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : NaN;
        const medRaw = vals.length
            ? (vals.length % 2 === 0 ? (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2 : vals[Math.floor(vals.length / 2)])
            : NaN;

        const overview = `<div class="stat-card"><span class="stat-label">${periodSortCol}概览</span>` +
            `<span class="stat-pill up">▲ 涨 ${rise}</span>` +
            `<span class="stat-pill down">▼ 跌 ${fall}</span>` +
            `${flat ? `<span class="stat-pill flat">平 ${flat}</span>` : ''}` +
            `<span class="stat-label">均值</span><span class="stat-pill avg">${fmtPct(avgRaw)}</span>` +
            `<span class="stat-label">中位</span><span class="stat-pill avg">${fmtPct(medRaw)}</span></div>`;
        const weakHtml = buildSectorHtml(weakKwsFull || [], '弱势', '今日总成交');
        const strongHtml = buildSectorHtml(strongKwsFull || [], '强势', '今日总成交');
        document.getElementById('statsBar').innerHTML =
            [weakHtml, overview, strongHtml].filter(Boolean).join('<span class="stat-sep"></span>');

        // ---------- 排序 ----------
        const sortDir = periodSortAsc ? -1 : 1;

        // 排序：指数模式按指数行、ETF模式按ETF行
        const indices = Array.from({length: top.length}, (_, i) => i);
        indices.sort((a, b) => {
            const va = top[a][periodSortCol], vb = top[b][periodSortCol];
            if (isNaN(va) && isNaN(vb)) return 0;
            if (isNaN(va)) return 1;
            if (isNaN(vb)) return -1;
            return sortDir * (va - vb);
        });
        const sortedTop = indices.map(i => top[i]);
        // 预计算每个指数的成分ETF总市值（tooltip 高频 hover 时复用，避免每次重算的 reduce）
        for (const r of sortedTop) {
            r._idxMcap = r.ETF列表 ? r.ETF列表.reduce((s, d) => s + (d.总市值 || 0), 0) : 0;
        }

        // 指数周期：每行一个指数，行数保持紧凑（不展开成分ETF子行）
        const yLabels = sortedTop.map(r => truncLabel(r[nameField]));

        // 每列独立归一化（基于排序后的指数行）
        const zRawSorted = sortedTop.map(r => PERIOD_COLS.map(c => r[c]));
        const zDisplaySorted = zRawSorted.map(r => r.slice());
        for (let j = 0; j < PERIOD_COLS.length; j++) {
            const col = zRawSorted.map(r => r[j]);
            const posVals = col.filter(v => v > 0);
            const negVals = col.filter(v => v < 0);
            const posMax = posVals.length ? Math.max(...posVals) : 1.0;
            const negMax = negVals.length ? Math.abs(Math.min(...negVals)) : 1.0;
            for (let i = 0; i < col.length; i++) {
                const v = col[i];
                if (isNaN(v)) zDisplaySorted[i][j] = NaN;
                else if (v >= 0) zDisplaySorted[i][j] = posMax > 0 ? v / posMax : 0;
                else zDisplaySorted[i][j] = negMax > 0 ? v / negMax : 0;
            }
        }

        // ---------- 热力图数据 ----------
        const heatmapData = [];
        for (let i = 0; i < sortedTop.length; i++) {
            for (let j = 0; j < PERIOD_COLS.length; j++) {
                heatmapData.push([j, i, zDisplaySorted[i][j], zRawSorted[i][j]]);
            }
        }
        // 取全量 sortedTop 中各周期涨幅的绝对值最大值，作为 visualMap 对称范围
        let maxAbs = 0;
        for (const row of sortedTop) {
            for (const col of PERIOD_COLS) {
                const v = row[col];
                if (!isNaN(v)) maxAbs = Math.max(maxAbs, Math.abs(v));
            }
        }

        // X轴标签（含排序指示）
        const arrow = periodSortAsc ? '▼' : '▲';
        const suffix = periodSortAsc ? '后40' : '前40';
        const xLabels = PERIOD_COLS.map(c => c === periodSortCol ? `${c} ${arrow}${suffix}` : c);

        // ---------- ECharts 配置 ----------
        const option = {
            backgroundColor: '#141414',
            tooltip: {
                ...ECH_TOOLTIP,
                confine: true,
                extraCssText: 'max-width:320px;white-space:normal;word-break:break-all;',
                formatter(params) {
                    const [xj, yi, , rawVal] = params.data;
                    const r = sortedTop[yi];
                    if (!r) return '';
                    const periodName = PERIOD_COLS[xj];
                    const valStr = fmtPct(rawVal);
                    if (isEtf) {
                        return `<b>${r.名称}</b>(${r.代码})<br>跟踪指数: ${r.指数名称 || '--'}` +
                            `<br>成交额: ${fmtAmount(r.成交额)} | 总市值: ${fmtAmount(r.总市值)}` +
                            `<br>${periodName}: ${valStr}`;
                    }
                    // 指数行：市值加权参考值 + 成分ETF各自涨幅及与指数差值
                    const idxMcap = r._idxMcap || 0;
                    let html = `<b>${r.指数名称}</b> ${r.ETF数量}只` +
                        `<br>成交额: ${fmtAmount(r.成交额)} | 总市值: ${fmtAmount(idxMcap)}` +
                        `<br><b>${periodName}（指数）: ${valStr}</b>`;
                    if (r.ETF列表 && r.ETF列表.length) {
                        // 按与指数误差升序排列，最紧跟指数的（误差最小）排最前
                        const f = periodName === '今天' ? TODAY_FIELD : periodName;
                        const etfs = r.ETF列表
                            .filter(d => d[f] != null && d[f] !== '' && !Number.isNaN(d[f]))
                            .map(d => ({d, ev: d[f], diff: isNaN(rawVal) ? NaN : d[f] - rawVal}))
                            .sort((a, b) => Math.abs(a.diff) - Math.abs(b.diff));
                        if (etfs.length) {
                            html += `<br><br>成分ETF（较指数）:`;
                            for (const {d, ev, diff} of etfs) {
                                const diffColor = isNaN(diff) ? '#aaa' : diff > 0 ? '#e74c3c' : diff < 0 ? '#2ecc71' : '#aaa';
                                const diffStr = isNaN(diff) ? '' : ` <span style="color:${diffColor}">(${fmtPct2(diff)})</span>`;
                                html += `<br>${truncLabel(d.名称)}(${d.代码}): ${fmtPct(ev)}${diffStr}` +
                                    `<br><span style="color:#888;font-size:11px">成交 ${fmtAmount(d.成交额)} | 市值 ${fmtAmount(d.总市值)}</span>`;
                            }
                        }
                    }
                    return html;
                }
            },
            grid: {left: '8%', right: '6%', top: '4%', bottom: '6%', containLabel: true},
            xAxis: {
                type: 'category',
                data: xLabels,
                position: 'top',
                splitArea: {show: true, areaStyle: {color: ['rgba(255,255,255,0.015)', 'rgba(255,255,255,0.025)']}},
                axisLine: {lineStyle: {color: '#444'}},
                axisLabel: {color: '#ccc', fontSize: 11},
                axisTick: {show: false},
                triggerEvent: true
            },
            yAxis: {
                type: 'category',
                data: yLabels,
                splitArea: {show: true, areaStyle: {color: ['rgba(255,255,255,0.015)', 'rgba(255,255,255,0.025)']}},
                axisLine: {lineStyle: {color: '#444'}},
                axisLabel: {color: '#aaa', fontSize: 10},
                axisTick: {show: false}
            },
            visualMap: {
                min: -maxAbs, max: maxAbs,
                dimension: 3,
                calculable: true,
                orient: 'vertical',
                right: 15, top: 'center', bottom: 20,
                inRange: {color: VISUAL_MAP_COLORS},
                textStyle: {color: '#ccc', fontSize: 11}
            },
            series: [{
                name: isEtf ? 'ETF周期' : '指数周期',
                type: 'heatmap',
                data: heatmapData,
                label: {
                    show: true,
                    formatter(p) {
                        return fmtPct2(p.data[3]);
                    },
                    color: '#000', fontSize: 10, fontWeight: 'bold'
                },
                itemStyle: {borderColor: '#222', borderWidth: 1}
            }]
        };

        // ---------- 渲染 ----------
        const inst = initECharts('chart', true);
        if (!inst) return;

        inst.setOption(option, true);

        // 实例被复用，先解除旧点击绑定，避免重复监听叠加
        inst.off('click');
        inst.on('click', function (params) {
            // 点击X轴标签排序
            if (params.componentType === 'xAxis') {
                const matched = PERIOD_COLS.find(c => params.value.startsWith(c));
                if (matched) sortPeriod(matched);
            }

            // 点击单元格 - 打开对应详情
            if (params.componentType === 'series' && params.seriesType === 'heatmap') {
                const [xj, yi] = params.data;
                const r = sortedTop[yi];
                if (!r) return;
                if (isEtf) openDetail(r);
                else openIndexPanel(r.指数代码);
            }
        });
    }

    /* ======================== 渲染调度 ======================== */
    // 根据当前 chartType + rule 渲染对应图表
    // 图表渲染分发表：0=ETF热力图 1=指数热力图 2=指数周期 3=指数周期 4=ETF周期
    const RENDER_DISPATCH = [
        () => renderEtfTreemap(currentRule, containLOF),
        () => renderIndexTreemap(currentRule, containLOF),
        () => renderPeriodHeatmap(currentRule, containLOF, 'index'),
        () => renderPeriodHeatmap(currentRule, containLOF, 'etf'),
    ];

    function render() {
        // 清理旧图表：ECharts 实例，避免内存泄漏与 DOM 残留
        disposeECharts('chart');
        const fn = RENDER_DISPATCH[currentChartType];
        if (fn) fn();
    }

    function filterByRule(rule) {
        currentRule = rule;
        document.querySelectorAll('.filter-btn[data-rule]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.rule === rule);
        });
        render();
    }

    function filterByLOF(checked) {
        containLOF = !!checked; // 强制转成布尔值
        document.getElementById('lofCheckbox').checked = containLOF;
        render();
    }

    // 切换图表类型：0 = ETF热力图，1 = 指数热力图，2 = 指数周期，3 = 指数周期 4 = ETF周期
    function showChartType(index) {
        currentChartType = index;
        document.querySelectorAll('.tab-btn').forEach((el, i) => el.classList.toggle('active', i === index));
        // 周期图显示统计栏（展示强势/弱势关键词），成交额/总市值切换按钮置灰
        const sb = document.getElementById('statsBar');
        if (sb) sb.style.display = '';
        const isPeriod = (index === 2 || index === 3);
        const sortBtns = [document.getElementById('sortAmtBtn'), document.getElementById('sortMcapBtn')];
        sortBtns.forEach(btn => {
            if (!btn) return;
            btn.style.opacity = isPeriod ? '0.3' : '';
            btn.style.pointerEvents = isPeriod ? 'none' : '';
        });
        render();
    }

    // 周期排序：点击同一列切换前40/后40，点击不同列重置为前40
    function sortPeriod(col) {
        if (periodSortCol === col) periodSortAsc = !periodSortAsc;
        else {
            periodSortCol = col;
            periodSortAsc = false;
        }
        if (currentChartType === 2 || currentChartType === 3) render();
    }

    // 切换按成交额/总市值排序（仅影响ETF热力图和指数热力图）
    function sortEtfField(field) {
        etfSortField = field;
        document.getElementById('sortAmtBtn').classList.toggle('active', field === '成交额');
        document.getElementById('sortMcapBtn').classList.toggle('active', field === '总市值');
        if (currentChartType === 0 || currentChartType === 1) render();
    }

    /* ======================== 刷新与自动刷新 ======================== */
    // forceRefresh: true=强制从API获取(点击刷新), false=非交易时间优先从缓存加载(页面初始化)
    async function refreshData(forceRefresh = false) {
        if (isRefreshing) {
            showToast('正在刷新中，请稍候...');
            return;
        }
        if (!isRealtime) {
            if (currentTime !== 'realtime') {
                selectTime(currentTime);
            } else {
                backToToday();
            }
            return;
        }
        if (!forceRefresh && !isTradeTime()) {
            const history = getHistory();
            const dates = Object.keys(history).sort().reverse();
            let foundDate = null, foundTime = null;
            for (const d of dates) {
                const times = Object.keys(history[d]).sort();
                if (times.length) {
                    foundDate = d;
                    foundTime = times[times.length - 1];
                    break;
                }
            }
            if (foundDate && foundTime) {
                const snap = getSnapshot(foundDate, foundTime);
                if (snap) {
                    try {
                        allData = decompressData(snap.allData);
                        dedupData = dedupByIndex(allData);
                        realtimeAllData = allData;
                        realtimeDedupData = dedupData;
                        clearPeriodCache();
                        render();
                        showToast(`已加载 ${foundDate} ${foundTime} 缓存数据`);
                    } catch (e) {
                        console.error('缓存数据加载失败:', e);
                    } finally {
                        setLoading('', false);
                    }
                    return;
                }
            }
        }
        isRefreshing = true;
        const btn = document.querySelector('.tab-right .tab-action');
        if (btn) {
            btn.disabled = true;
        }
        try {
            setLoading('正在获取ETF实时数据...', true);
            await loadAllData();
            const td = getTradeDate();
            if (td !== currentDate) {
                currentDate = td;
                document.getElementById('datePicker').value = td;
                updateDateList();
                updateReviewLabel();
            }
            isRealtime = (currentDate === formatDate(new Date()));
            if (isTradeTime()) {
                const st = getCurrentSaveTime();
                if (st) {
                    // 刚拉取最新数据，始终覆盖当前时间段快照，避免旧数据残留
                    saveSnapshot(getTradeDate(), st);
                }
            }
            render();
            setLoading('', false);
            showToast('数据已更新 ✓');
        } catch (e) {
            setLoading('', false);
            document.getElementById('statusText').textContent = '';
            const isFetchErr = e.message && (e.message.includes('Failed to fetch') || e.message.includes('HTTP') || e.message.includes('超时'));
            const hint = isFetchErr
                ? '（数据中心接口需通过 http 访问；若以 file:// 双击打开本页，请改用本地静态服务器，如在该目录执行 python -m http.server 8080 后访问 http://localhost:8080/etf_heatmap.html）'
                : '（可能是网络或接口限制，请稍后重试）';
            showToast('数据获取失败: ' + e.message + hint);
            console.error(e);
        } finally {
            isRefreshing = false;
            if (btn) {
                btn.disabled = false;
            }
        }
    }

    function toggleAutoRefresh() {
        const checked = document.getElementById('autoRefresh').checked;
        if (checked && isTradeTime()) {
            const minutes = parseInt(document.getElementById('autoRefreshMinutes').value) || 15;
            const interval = Math.max(1, Math.min(120, minutes)) * 60000;
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                if (!isRealtime) return;
                refreshData(true);
            }, interval);
        } else {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
        }
    }

    // 显示/隐藏输入框
    function toggleIndexCodeInput() {
        const wrap = document.getElementById('indexCodeInputWrap');
        const input = document.getElementById('indexCodeInput');
        if (wrap.style.display === 'none') {
            hideEtfCodeInput(true);
            wrap.style.display = 'block';
            input.focus();
            activeSearchInput = 'index';
        } else {
            wrap.style.display = 'none';
            input.value = '';
            if (activeSearchInput === 'index') activeSearchInput = null;
        }
    }

    // 隐藏输入框（失焦时延迟隐藏）
    function hideIndexCodeInput() {
        setTimeout(() => {
            const wrap = document.getElementById('indexCodeInputWrap');
            if (wrap) wrap.style.display = 'none';
            if (activeSearchInput === 'index') activeSearchInput = null;
        }, 200);
    }

    // 根据输入的 secid 查询并显示分时数据
    function searchIndexByCode(quoteId) {
        const input = document.getElementById('indexCodeInput');
        const secid = quoteId || input?.value?.trim();
        if (!secid) return;

        currentIndexSecid = secid;
        // 等待输入框/面板切换完成后再刷新指数分时
        setTimeout(() => {
            try {
                switchIndexTab(current_idx);
            } catch (e) {
                console.error('切换指数分时失败:', e);
            }

    /* ======================== ETF 代码搜索（详情弹窗） ======================== */
    // 显示/隐藏ETF输入框
    function toggleEtfCodeInput() {
        const wrap = document.getElementById('etfCodeInputWrap');
        const input = document.getElementById('etfCodeInput');
        if (!wrap || !input) return;
        if (wrap.style.display === 'none') {
            hideIndexCodeInput();
            wrap.style.display = 'block';
            input.focus();
            activeSearchInput = 'etf';
        } else {
            wrap.style.display = 'none';
            input.value = '';
            hideSearchResults();
            if (activeSearchInput === 'etf') activeSearchInput = null;
        }
    }

    // 隐藏ETF输入框（失焦时延迟隐藏）
    function hideEtfCodeInput(immediate) {
        const hide = () => {
            const wrap = document.getElementById('etfCodeInputWrap');
            if (wrap) wrap.style.display = 'none';
            if (activeSearchInput === 'etf') activeSearchInput = null;
        };
        if (immediate) hide();
        else setTimeout(hide, 200);
    }

    // 根据输入的 secid 查询并打开ETF详情
    async function searchEtfByCode(quoteId, displayName) {
        const input = document.getElementById('etfCodeInput');
        const secid = quoteId || input?.value?.trim();
        if (!secid) return;

        // 解析 secid：支持 "0.159509" 或纯代码 "159509"（默认市场 0）
        let market = '0', code = secid;
        if (secid.includes('.')) {
            const [m, c] = secid.split('.');
            market = m || '0';
            code = c;
        }

        // 调用方未提供名称时，先拉一次行情补齐名称（避免详情头部空白）
        let name = displayName || '';
        if (!name) {
            try {
                const quoteMap = await fetchQuoteBatch(`${market}.${code}`);
                const q = quoteMap.get(`${market}.${code}`);
                if (q && q.name) name = q.name;
            } catch (_) {
            }
        }

        const item = {代码: code, 名称: name, 市场: market};

        try {
            await openDetail(item);
            hideSearchResults();
            if (input) input.value = '';
        } catch (e) {
            console.error('查询ETF失败:', e);
            alert('未找到该ETF，请检查代码格式（如 159509, 510300）');
        }
    }

    // 键盘导航支持（指数/ETF共用一套逻辑）
    function bindSearchKeydown(inputId, type) {
        const el = document.getElementById(inputId);
        if (!el) return;
        el.addEventListener('keydown', function (e) {
            activeSearchInput = type;
            const resultsContainer = getResultsContainer();
            const items = resultsContainer?.querySelectorAll('.search-result-item');

            if (!items || items.length === 0) return;

            const currentSelected = resultsContainer.querySelector('.search-result-item.selected');
            let currentIndex = currentSelected ? parseInt(currentSelected.dataset.index) : -1;

            switch (e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    currentIndex = (currentIndex + 1) % items.length;
                    updateSelection(items, currentIndex);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    currentIndex = (currentIndex - 1 + items.length) % items.length;
                    updateSelection(items, currentIndex);
                    break;
                case 'Enter':
                    if (currentSelected) {
                        e.preventDefault();
                        selectSearchResult(currentIndex);
                    }
                    break;
                case 'Escape':
                    hideSearchResults();
                    break;
            }
        });
    }

    bindSearchKeydown('indexCodeInput', 'index');
    bindSearchKeydown('etfCodeInput', 'etf');

    /**
     * 更新选中状态
     */
    function updateSelection(items, index) {
        items.forEach(item => item.classList.remove('selected'));
        if (items[index]) {
            items[index].classList.add('selected');
            items[index].scrollIntoView({block: 'nearest'});
        }
    }

    /* ======================== 侧栏折叠 ======================== */
    function toggleSidebar() {
        const side = document.getElementById('sideHistory');
        const btn = side.querySelector('.sidebar-toggle');
        const collapsed = side.classList.toggle('collapsed');
        document.body.classList.toggle('sidebar-closed', collapsed);
        btn.textContent = collapsed ? '▶' : '◀';
        btn.title = collapsed ? '显示历史复盘' : '隐藏历史复盘';
        setTimeout(() => {
            if (echInstances['chart']) {
                echInstances['chart'].resize();
            }
        }, 300);
    }

    /* ======================== 搜索框 ======================== */
    // 防抖计时器
    let searchTimer = null;
    // 当前搜索结果数据
    let currentSearchResults = [];
    // 当前激活的搜索输入：'index' | 'etf' | null
    let activeSearchInput = null;

    // 根据当前激活的输入返回对应的下拉结果容器
    function getResultsContainer() {
        return document.getElementById(activeSearchInput === 'etf' ? 'searchResultsEtf' : 'searchResults');
    }

    /**
     * 处理输入搜索
     */
    function handleInputSearch(inputEl) {
        const el = inputEl || (activeSearchInput === 'etf'
            ? document.getElementById('etfCodeInput')
            : document.getElementById('indexCodeInput'));
        if (!el) return;
        if (el.id === 'etfCodeInput') activeSearchInput = 'etf';
        else activeSearchInput = 'index';
        const keyword = el.value.trim();

        // 清除之前的计时器
        if (searchTimer) {
            clearTimeout(searchTimer);
        }

        // 如果关键词为空，隐藏结果
        if (!keyword) {
            hideSearchResults();
            return;
        }

        // 防抖处理：300ms后执行搜索
        searchTimer = setTimeout(() => {
            performSearch(keyword);
        }, 300);
    }

    async function search(keyword) {
        const params = {
            and14: `MultiMatch/Name,Code,PinYin/${keyword}/true`,
            appid: 'el1902262',
            type: '14',
            token: 'CCSDCZSDCXYMYZYYSYYXSMDDSMDHHDJT',
            returnfields14: 'Name,Code,PinYin,MarketType,JYS,MktNum,JYS4App,MktNum4App,ID,Classify,IsExactMatch,SecurityType,SecurityTypeName',
            pageIndex14: '1',
            pageSize14: '15',
            isAssociation14: 'false'
        };
        const response = await fetchJson(SEARCH_URL, params, 30000, 3);
        return response || {};
    }

    /**
     * 执行搜索
     * @param {string} keyword 搜索关键词
     */
    async function performSearch(keyword) {
        try {
            const data = await search(keyword);

            if (data.Status === 0 && data.Data && data.Data.length > 0) {
                currentSearchResults = data.Data;
                displaySearchResults(data.Data);
            } else {
                showNoResults();
            }
        } catch (error) {
            console.error('搜索失败:', error);
            showError();
        }
    }

    /**
     * 显示搜索结果
     * @param {Array} results 搜索结果数组
     */
    function displaySearchResults(results) {
        const resultsContainer = getResultsContainer();

        let html = '';
        results.forEach((item, index) => {
            const marketPrefix = item.MarketPrefix || '';
            const code = item.Code || '';
            const name = item.Name || '';
            const securityType = item.SecurityTypeName || '未知';

            html += `
                <div class="search-result-item"
                    data-index="${index}"
                    data-quote-id="${item.QuoteID || ''}"
                    onclick="selectSearchResult(${index})">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="color:#fff; font-weight:bold;">${marketPrefix}.${code}</span>
                            <span style="color:#888; margin-left:8px; font-size:11px;">${securityType}</span>
                        </div>
                        <div style="color:#ccc; font-size:13px; text-align:right; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                            ${name}
                        </div>
                    </div>
                    ${item.PinYin ? `<div style="color:#666; font-size:10px; margin-top:2px;">${item.PinYin}</div>` : ''}
                </div>
            `;
        });

        resultsContainer.innerHTML = html;
        resultsContainer.style.display = 'block';
    }

    /**
     * 显示无结果
     */
    function showNoResults() {
        const resultsContainer = getResultsContainer();
        resultsContainer.innerHTML = `
            <div style="padding:12px; text-align:center; color:#888; font-size:12px;">
                未找到匹配的结果
            </div>
        `;
        resultsContainer.style.display = 'block';
    }

    /**
     * 显示错误
     */
    function showError() {
        const resultsContainer = getResultsContainer();
        resultsContainer.innerHTML = `
            <div style="padding:12px; text-align:center; color:#ff6b6b; font-size:12px;">
                搜索服务暂不可用，请稍后重试
            </div>
        `;
        resultsContainer.style.display = 'block';
    }

    /**
     * 选择搜索结果
     * @param {number} index 结果索引
     */
    function selectSearchResult(index) {
        const selectedItem = currentSearchResults[index];
        if (!selectedItem) return;
        const quoteId = selectedItem.QuoteID || selectedItem.Code;
        const name = selectedItem.Name || '';

        // 隐藏搜索结果
        hideSearchResults();

        // 按当前激活输入路由到对应的查询函数
        if (activeSearchInput === 'etf') {
            const input = document.getElementById('etfCodeInput');
            if (input) input.value = quoteId;
            searchEtfByCode(quoteId, name);
        } else {
            const input = document.getElementById('indexCodeInput');
            input.value = quoteId;
            searchIndexByCode(quoteId);
        }
    }

    /**
     * 隐藏搜索结果（同时隐藏指数/ETF两个下拉）
     */
    function hideSearchResults() {
        ['searchResults', 'searchResultsEtf'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        });
    }

    /* ======================== 初始化 ======================== */
    document.body.classList.add('sidebar-closed');
    // 窗口缩放时防抖批量 resize，避免拖拽窗口过程中高频触发 ECharts 重排
    let _resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
            // resize 所有活跃的 ECharts 实例，避免侧栏切换/窗口缩放后图表变形
            for (const elId in echInstances) {
                if (echInstances[elId]) echInstances[elId].resize();
            }
        }, 150);
    });
    document.getElementById('autoRefresh').addEventListener('change', toggleAutoRefresh);
    window.addEventListener('load', async () => {
        await loadHolidays();
        document.getElementById('datePicker').value = currentDate;
        updateDateList();
        updateTimeButtons();
        await refreshData(false);
    });

    // 5s 心跳：详情+指数抬头合并为一次 ulist 请求（secids 批量），减少接口调用
    heartbeatTimer = setInterval(() => {
        // 检查一次自动保存
        autoSaveCheck()
        if (document.hidden) return;
        refreshBothQuotes();
        for (const elId in refreshTasks) {
            const task = refreshTasks[elId];
            // 沪深标的非交易时间跳过图表刷新（注册时已通过，收盘后需重新拦截）
            if (task.secid && !canDoMarketRefresh(task.secid)) continue;
            try {
                task.fn();
            } catch (e) {
                console.error('[图表刷新失败]', elId, e.message);
            }
        }
    }, 5 * 1000);

    let syncViewEnabled = true;
    let syncing = 0;

    document.getElementById('syncViewCheckbox').addEventListener('change', function (e) {
        syncViewEnabled = e.target.checked;
        syncing = 0
    });

    window.addEventListener('beforeunload', stopAllChartRefresh);

</script>
