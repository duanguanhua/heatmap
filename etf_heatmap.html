<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF热力图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script>
        // 消除 Chrome 控制台 [Violation] 警告：
        // ECharts(zrender) 注册 wheel/mousewheel/touch 等可阻塞滚动事件时未指定 passive，
        // 这里在创建图表前给 addEventListener 加一层包装，为未显式指定 passive 的此类事件
        // 补上 {passive: false}，既消除警告，又保留 ECharts 滚轮缩放时 preventDefault 的能力。
        (function () {
            const SCROLL_BLOCKING = ['wheel', 'mousewheel', 'touchstart', 'touchmove'];
            const orig = EventTarget.prototype.addEventListener;
            if (orig.__passivePatched) return;
            EventTarget.prototype.addEventListener = function (type, listener, options) {
                if (SCROLL_BLOCKING.indexOf(type) !== -1 && typeof listener === 'function') {
                    if (options === undefined || options === null) {
                        options = {passive: false};
                    } else if (typeof options === 'boolean') {
                        options = {capture: options, passive: false};
                    } else if (typeof options === 'object' && !('passive' in options)) {
                        options = Object.assign({}, options, {passive: false});
                    }
                }
                return orig.call(this, type, listener, options);
            };
            orig.__passivePatched = true;
        })();
    </script>
    <style>

            /* 主题色板 */
            --bg-base: #141414;
            --bg-panel: #0e0e20;
            --bg-elevated: #16213e;
            --bg-elevated-2: #1a2348;
            --bg-input: #1a1a2e;
            --border-soft: #0f3460;
            --border-mid: #1a4a7a;

            --accent: #00d4ff;
            --accent-dim: rgba(0, 212, 255, .12);
            --accent-soft: rgba(0, 212, 255, .2);
            --warn: #e67e22;
            --warn-dim: rgba(230, 126, 34, .12);
            --danger: #c0392b;
            --danger-hover: #e74c3c;

            --text: #fff;
            --text-2: #cfcfe0;
            --text-3: #a0a0a0;
            --text-mute: #888;

            --up: #ff6b6b;
            --down: #4ade80;

            /* 复用渐变 / 阴影 */
            --grad-panel: linear-gradient(135deg, #16213e 0%, #1a2348 100%);
            --grad-bar: linear-gradient(180deg, #16213e 0%, #101728 100%);
            --shadow-panel: 0 8px 40px rgba(0, 0, 0, .6);
            --radius: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Firefox 统一细滚动条 */
            scrollbar-width: thin;
            scrollbar-color: var(--border-mid) rgba(0, 0, 0, .25);
        }

        html, body {
            height: 100%;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text);
            display: flex;
            flex-direction: row;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, .25);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--border-mid), var(--border-soft));
            border-radius: 4px;
            border: 1px solid rgba(0, 212, 255, .1);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--accent), var(--border-mid));
        }

        .sidebar {
            width: 160px;
            background: #0e0e20;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width .25s ease, border .25s ease;
            position: relative;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            border-right: none;
            overflow: visible;
        }

        .sidebar-toggle {
            position: absolute;
            right: 2px;
            top: 6px;
            width: 22px;
            height: 60px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 4px 0 0 4px;
            color: #00d4ff;
            cursor: pointer;
            font-size: 12px;
            line-height: 60px;
            text-align: center;
            z-index: 10;
            transition: right .25s ease, border-radius .25s ease, background .2s, box-shadow .2s;
            padding: 0;
            user-select: none;
            border-right: none;
            box-shadow: -2px 0 6px rgba(0, 0, 0, .3);
        }

        .sidebar.collapsed .sidebar-toggle {
            right: -22px;
            border-radius: 0 4px 4px 0;
            border-right: 1px solid #1a4a7a;
            border-left: none;
        }

        .sidebar-toggle:hover {
            background: #1a4a7a;
            color: #fff;
            box-shadow: -2px 0 10px rgba(0, 212, 255, .2);
        }

        .sidebar-header {
            padding: 8px 10px;
            background: var(--grad-panel);
            border-bottom: 1px solid #0f3460;
        }

        .sidebar-header h3 {
            font-size: 13px;
            color: #00d4ff;
            margin: 0;
            text-align: center;
        }

        .sidebar-header .sub {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .date-controls {
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #0f3460;
        }

        .date-controls input[type="date"] {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #0f3460;
            padding: 3px 4px;
            border-radius: 4px;

            border-radius: 4px;

            white-space: nowrap;
        }

            color: #fff;
        }

        .date-list {

            overflow-y: auto;
            padding: 4px 6px;
        }

            position: relative;
            padding: 5px 26px 5px 7px;
            margin-bottom: 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #a0a0a0;
            background: rgba(15, 52, 96, .4);
            transition: all .2s;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

            right: 4px;
            top: 50%;

            height: 16px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;

            line-height: 16px;
            text-align: center;

            flex-direction: column;

            gap: 4px;

            padding: 4px;
            border: 1px solid rgba(15, 52, 96, .6);
            background: rgba(15, 52, 96, .4);
            color: #cfcfe0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all .2s;
        }

            background: rgba(26, 74, 122, .6);
            color: #fff;
        }

            color: #555;
            text-align: center;
        }

            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            position: relative;
        }

            flex-shrink: 0;
            max-height: 40vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

            align-items: center;
            padding: 7px 14px;
            background: linear-gradient(180deg, #16213e 0%, #101728 100%);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 6px 10px;
            border-bottom: 1px solid rgba(0, 212, 255, .15);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .4);
            transition: padding-left .25s ease;
            min-height: 38px;
        }

        body.sidebar-closed .tab-container {
            padding-left: 24px;
        }

        .tab-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .tab-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            min-width: 0;
        }

        .tab-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 4px 16px;
            margin: 0 1px;
            border: 1px solid transparent;
            background: transparent;
            color: #8a8a9a;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: all .25s;
            position: relative;
        }

        .tab-btn:hover {
            background: rgba(26, 74, 122, .4);
            color: #fff;
            border-color: rgba(0, 212, 255, .2);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, rgba(0, 212, 255, .18), rgba(0, 212, 255, .08));
            color: #00d4ff;
            border-color: rgba(0, 212, 255, .45);
            text-shadow: 0 0 8px rgba(0, 212, 255, .3);
            box-shadow: 0 0 10px rgba(0, 212, 255, .15), inset 0 0 8px rgba(0, 212, 255, .08);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            left: 6px;
            right: 6px;
            bottom: -1px;
            height: 2px;
            background: #00d4ff;
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(0, 212, 255, .4);
        }

        .filter-btn {
            padding: 4px 10px;
            border: 1px solid rgba(15, 52, 96, .6);
            background: transparent;
            color: #8a8a9a;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all .25s;
            line-height: 1.4;
        }

        .filter-btn:hover {
            background: rgba(26, 74, 122, .5);
            color: #fff;
            border-color: rgba(0, 212, 255, .3);
        }

        .filter-btn.active {
            background: rgba(0, 212, 255, .12);
            color: #00d4ff;
            border-color: rgba(0, 212, 255, .5);
            box-shadow: 0 0 8px rgba(0, 212, 255, .15);
        }

        .time-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #16213e;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        #bottomTimeBar {
            flex-shrink: 0;
            background: linear-gradient(0deg, rgba(14, 14, 32, .98), rgba(14, 14, 32, .92));
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(15, 52, 96, .5);
            padding: 2px 14px;
            box-shadow: 0 -3px 12px rgba(0, 0, 0, .3);
            transition: background .3s ease, box-shadow .3s ease;
        }

        #bottomTimeBar:hover {
            background: rgba(14, 14, 32, .7);
            box-shadow: none;
        }

        .time-label {
            font-size: 11px;
            color: #00d4ff;
            margin-right: 4px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .time-btn {
            padding: 2px 8px;
            border: 1px solid rgba(15, 52, 96, .4);
            background: rgba(15, 52, 96, .3);
            color: #a0a0a0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all .25s;
        }

        .time-btn:hover {
            background: rgba(26, 74, 122, .6);
            color: #fff;
            border-color: rgba(0, 212, 255, .3);
        }

        .time-btn.active {
            background: rgba(230, 126, 34, .2);
            color: #f0a030;
            border-color: #e67e22;
            box-shadow: 0 0 10px rgba(230, 126, 34, .3);
            font-weight: 600;
        }

        .time-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .snapshot-badge {
            font-size: 12px;
            color: #888;
            margin-left: auto;
            white-space: nowrap;
        }

        .tab-time {
            color: #a0a0a0;
            font-size: 12px;
            white-space: nowrap;
        }

        .tab-time b {
            color: #00d4ff;
        }

        /* 搜索栏 */
        #searchWrap {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 4px 3px 10px;
            background: rgba(15, 20, 38, .6);
            border: 1px solid rgba(15, 52, 96, .6);
            border-radius: 8px;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        #searchWrap:focus-within {
            border-color: rgba(0, 212, 255, .7);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, .12), 0 0 12px rgba(0, 212, 255, .15);
            background: rgba(15, 20, 38, .9);
        }

        #searchInput {
            width: 130px;
            max-width: 28vw;
            padding: 3px 2px;
            background: transparent;
            color: #fff;
            border: none;
            font-size: 12px;
            font-family: inherit;
            outline: none;
        }

        #searchInput::placeholder {
            color: #5a5a72;
        }

        #searchClear {
            width: 20px;
            height: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            background: rgba(120, 130, 160, .25);
            color: #cfcfe0;
            cursor: pointer;
            border-radius: 50%;
            font-size: 11px;
            line-height: 1;
            transition: background .2s, transform .15s;
        }

        #searchClear.visible {
            display: inline-flex;
            animation: popIn .18s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(.4);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #searchClear:hover {
            background: rgba(231, 76, 60, .5);
            color: #fff;
            transform: scale(1.1);
        }

        #searchCount {
            font-size: 11px;
            color: #00d4ff;
            background: rgba(0, 212, 255, .12);
            border: 1px solid rgba(0, 212, 255, .3);
            padding: 1px 7px;
            border-radius: 10px;
            white-space: nowrap;
            display: none;
            font-weight: 600;
        }

        #searchCount.visible {
            display: inline-block;
            animation: popIn .18s ease;
        }

        .tab-action {
            padding: 5px 14px;
            border: 1px solid rgba(15, 52, 96, .6);
            background: linear-gradient(180deg, rgba(26, 74, 122, .45), rgba(15, 52, 96, .35));
            color: #d6e8ff;
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all .25s;
            white-space: nowrap;
        }

        .tab-action:hover {
            background: linear-gradient(180deg, rgba(0, 212, 255, .35), rgba(26, 74, 122, .55));
            color: #fff;
            border-color: rgba(0, 212, 255, .6);
            box-shadow: 0 0 10px rgba(0, 212, 255, .25);
            transform: translateY(-1px);
        }

        .tab-action:active {
            transform: translateY(0);
        }

        #btnManualSave {
            border-color: rgba(230, 126, 34, .4);
            color: #e8b870;
            background: linear-gradient(180deg, rgba(230, 126, 34, .18), rgba(230, 126, 34, .08));
        }

        #btnManualSave:hover {
            background: linear-gradient(180deg, rgba(230, 126, 34, .35), rgba(230, 126, 34, .18));
            border-color: #e67e22;
            box-shadow: 0 0 10px rgba(230, 126, 34, .3);
        }

        .tab-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #8a8a9a;
            white-space: nowrap;
        }

        /* 工具栏分组分隔：替代原先的“|”文字 */
        .group-sep {
            width: 1px;
            height: 20px;
            background: linear-gradient(180deg, transparent, rgba(0, 212, 255, .25), transparent);
            flex-shrink: 0;
        }

        /* 工具栏分组包裹，弱化视觉密度 */
        .tool-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #autoRefreshMinutes {
            width: 45px;
            padding: 4px 4px;
            font-size: 12px;
            border: 1px solid rgba(15, 52, 96, .6);
            border-radius: 4px;
            background: rgba(15, 52, 96, .4);
            color: #cfcfe0;
            text-align: center;
        }

        /* ===== 统计栏：悬浮居中的毛玻璃胶囊（不占整行） ===== */
        #statsBar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            background: rgba(13, 13, 31, .45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, .12);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
            position: sticky;
            top: 6px;
            z-index: 9;
            flex-shrink: 0;
            min-height: 34px;
        }

        .stat-card {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .06);
            font-size: 12px;
            white-space: nowrap;
            transition: background .2s, border-color .2s;
        }

        .stat-card:hover {
            background: rgba(0, 212, 255, .06);
            border-color: rgba(0, 212, 255, .25);
        }

        .stat-card .stat-label {
            color: #7a7a90;
            font-size: 11px;
        }

        .stat-card .stat-val {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat-sep {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, .08);
            flex-shrink: 0;
        }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat-pill.up {
            color: #ff6b6b;
            background: rgba(231, 76, 60, .12);
        }

        .stat-pill.down {
            color: #4ade80;
            background: rgba(46, 204, 113, .12);
        }

        .stat-pill.flat {
            color: #c0c0d0;
            background: rgba(255, 255, 255, .06);
        }

        .stat-pill.avg {
            color: #fff;
            background: rgba(0, 0, 0, .25);
            border: 1px solid rgba(255, 255, 255, .1);
        }

        .stat-sector {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }

        .stat-sector b {
            font-weight: 700;
        }

        #chartArea {
            flex: 1;
            min-height: 200px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at center, rgba(20, 20, 50, .3), transparent);
        }

        #chartArea > div {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 20, .9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 16px;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 3px solid rgba(15, 52, 96, .4);
            border-top-color: #00d4ff;
            border-right-color: rgba(0, 212, 255, .5);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            box-shadow: 0 0 16px rgba(0, 212, 255, .25);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #00d4ff;
            font-size: 14px;
            letter-spacing: .5px;
            animation: pulseText 1.4s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% {
                opacity: .65;
            }
            50% {
                opacity: 1;
            }
        }

        .toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #c0392b;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        /* ===== 详情弹窗（当日走势 + K线） ===== */
        .detail-panel {
            position: fixed;
            top: 0;
            right: -32%;
            width: 32%;
            height: 100vh;
            background: #0e0e20;
            border-left: 1px solid rgba(0, 212, 255, .2);
            z-index: 200;
            transition: right .3s ease;
            display: flex;

    </div>

<script>
    /* ======================== 常量 ======================== */
    // 代理前缀：本页所有跨源请求均可通过这两个前缀转发到本地代理服务（默认 http://localhost:5000）
    const BASE_PROXY_PREFIX = 'http://localhost:5000/proxy';

    /* ---------- 接口 URL ---------- */
    // 东财实时行情：分页获取 ETF 列表（最新价/涨跌幅/成交量等），用于热力图主体数据
    const SPOT_URL = 'https://push2delay.eastmoney.com/api/qt/clist/get';
    // 东财 ulist：根据 secid 列表批量查询最新价/涨跌幅，用于持仓股行情刷新
    const ULIST_URL = 'https://push2delay.eastmoney.com/api/qt/ulist.np/get';
    // 东财数据中心：ETF 选择器，提供规模/折溢价/近1周~近1年涨跌幅等，用于周期矩阵与详情
    const DC_URL = 'https://datacenter.eastmoney.com/stock/etfselector/api/data/get';
    // 东财数据中心（web）：按指数代码分页查询成分股，用于指数持仓列表
    const DC_WEB_URL = 'https://datacenter-web.eastmoney.com/api/data/v1/get';
    // 东财历史行情：分时（当日）走势图数据，需配合 secid+ndays
    const TRENDS_DELAY_URL = 'https://push2delay.eastmoney.com/api/qt/stock/trends2/get';
    // 东财历史行情：五日走势图数据，需配合 secid+ndays
    const TRENDS_HIS_URL = 'https://push2his.eastmoney.com/api/qt/stock/trends2/get';
    // 东财历史行情：K线数据（日/周/月线），需配合 secid+klt+lmt
    const KLINE_URL = 'https://push2his.eastmoney.com/api/qt/stock/kline/get';
    // 东财基金 f10：基金持仓明细页（HTML 片段），用于解析基金前十大持仓
    const FUND_F10_URL = 'https://fundf10.eastmoney.com/FundArchivesDatas.aspx';
    // 东财搜索：根据关键词检索 ETF/股票/指数代码，用于顶部搜索框
    const SEARCH_URL = 'https://searchapi.eastmoney.com/api/Info/Search';
    // 天天基金 IOPV：基金参考净值曲线（实时估值），用于详情面板 IOPV 小图
    const IOPV_URL = 'https://fundcomapi.tiantianfunds.com/mm/newCore/FundVPageDiagramNew';
    // 第三方节假日 API：按年返回当年节假日列表，用于判断是否交易日（失败则仅按周末判断）
    const HOLIDAY_URL = 'https://timor.tech/api/holiday/year';


    const SPOT_UT = 'bd1d9ddb04089700cf9c27f6f7426281';
    const SPOT_FIELDS = 'f2,f3,f4,f5,f6,f7,f8,f10,f12,f13,f14,f15,f16,f17,f18,f20,f21,f24,f25,f33,f109,f124,f145,f297,f402,f441';
    // T+0 / T+1 市场板块配置（与Python一致，排除货币ETF/债券类LOF）
    const FS_CONFIG = {
        'T+0': 'b:MK0023,b:MK0024,b:MK0827,b:MK0407',
        'T+1': 'b:MK0021,b:MK0404,b:MK0406'
    };
    const DC_STY = 'ETF_TYPE_CODE,DEAL_AMOUNT,SECUCODE,SECURITY_CODE,CHANGE_RATE_1W,CHANGE_RATE_1M,' +
        'CHANGE_RATE_3M,CHANGE_RATE_6M,CHANGE_RATE_12M,ETF_SCALE,YTD_CHANGE_RATE,' +
        'DEC_TOTALSHARE,DEC_NAV,SECURITY_NAME_ABBR,DERIVE_INDEX_CODE,INDEX_CODE,' +
        'INDEXNAME,NW_PRICE,CHANGE_RATE,CHANGE,VOLUME,PREMIUM_DISCOUNT_RATIO,' +
        'QUANTITY_RELATIVE_RATIO,HIGH_PRICE,LOW_PRICE,PRE_PRE_PRICE,' +
        'PREMIUM_RATIO,HIGH,LOW,SPEED_UP,STOCK_ID,IS_SUPPORT';
    // 周期列。'今天' 实际对应数据中的'涨跌幅'字段（当日涨跌幅），在 buildPeriodMatrix 中映射
    const PERIOD_COLS = ['今天', '近1周', '近1月', '近3月', '近6月', '近1年', '今年来'];
    // '今天' 在数据对象中的实际字段名
    const TODAY_FIELD = '涨跌幅';
    // 指数周期图 y轴标签最大字符数（超出截断+省略号，鼠标悬浮显示全称）
    const MAX_PERIOD_LABEL_LEN = 8;
    const init_kline_size = 280; // 初始k线图数量
    // 涨跌幅(%) 范围
    const COLOR_SCALE_ABS = [-10, 10]
    const COLORSCALE = [
        [0.0, '#004400'], [0.125, '#006600'], [0.25, '#00AA00'], [0.375, '#66FF66'],
        [0.5, '#FFFFFF'], [0.625, '#FFCCCC'], [0.75, '#FF6666'], [0.875, '#FF3333'], [1.0, '#CC0000']
    ];
    // visualMap 纯色阶（与 COLORSCALE 同色阶，供 visualMap.inRange.color 复用，避免重复维护）
    const VISUAL_MAP_COLORS = COLORSCALE.map(c => c[1]);

    // 十六进制颜色 -> {r,g,b}
    function hexToRgb(hexColor) {
        return {
            r: parseInt(hexColor.slice(1, 3), 16),
            g: parseInt(hexColor.slice(3, 5), 16),
            b: parseInt(hexColor.slice(5, 7), 16)
        };
    }

    // 预计算 COLORSCALE 各停止点的 RGB，避免渲染时反复解析十六进制
    const COLORSCALE_RGB = COLORSCALE.map(([stop, hex]) => [stop, hexToRgb(hex)]);

    function getTreemapColor(value) {
        if (isNaN(value)) return '#666';
        const [min, max] = COLOR_SCALE_ABS;
        const range = max - min;
        const normalized = Math.max(0, Math.min(1, (value - min) / range));
        for (let i = 1; i < COLORSCALE_RGB.length; i++) {
            if (normalized <= COLORSCALE_RGB[i][0]) {
                const prev = COLORSCALE_RGB[i - 1];
                const curr = COLORSCALE_RGB[i];
                const t = (normalized - prev[0]) / (curr[0] - prev[0]);
                return interpolateColor(prev[1], curr[1], t);
            }
        }
        return COLORSCALE[COLORSCALE.length - 1][1];
    }

    // 在两个 {r,g,b} 对象之间线性插值，返回 #rrggbb 字符串
    function interpolateColor(rgb1, rgb2, t) {
        const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * t);
        const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * t);
        const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * t);
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }

    // 根据背景色亮度返回可读的文字颜色（浅色背景用深色文字，深色背景用白色文字）
    const _contrastCache = {};

    function getContrastText(hexColor) {
        if (!hexColor || hexColor.length < 7) return '#ffffff';
        if (_contrastCache[hexColor]) return _contrastCache[hexColor];
        const {r, g, b} = hexToRgb(hexColor);
        // 相对亮度（sRGB 线性化近似，更准确）
        const srgb = [r / 255, g / 255, b / 255].map(c =>
            c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
        );
        const luminance = 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
        // 阈值设为 0.18（约对应 #8C8C8C），大于此值用黑色，否则白色
        const result = luminance > 0.179 ? '#000000' : '#ffffff';
        _contrastCache[hexColor] = result;
        return result;
    }

    function compressData(data) {

        return {h: header, r: rows};
    }

    function decompressData(compressed) {
        if (!compressed || !compressed.h || !compressed.r) return [];
        const header = compressed.h;
        return compressed.r.map(row => {
            const item = {};
            for (let i = 0; i < header.length; i++) {
                item[header[i]] = row[i];
            }
            return item;
        });
    }

    /* ======================== 工具函数 ======================== */
    function toNum(v) {
        if (v === null || v === undefined || v === '-' || v === '') return null;
        const n = typeof v === 'number' ? v : parseFloat(v);
        return isNaN(n) ? null : n;
    }

    function fmtAmount(value) {

    function fmtVol(vol) {

    /** 格式化金额/成交量等数值，自动选单位 */
    function fmtNum(value, unit) {
        // 1. 过滤 null / undefined
        if (value == null) return '--';

        // 2. 强制转换为数字类型，并检查是否为 NaN
        const num = Number(value);
        if (isNaN(num)) return '--';

        unit = unit || '';
        const abs = Math.abs(num); // 使用转换后的 num 进行计算

        if (abs >= 1e12) return (num / 1e12).toFixed(2) + '万亿' + unit;
        if (abs >= 1e8) return (num / 1e8).toFixed(2) + '亿' + unit;
        if (abs >= 1e4) return (num / 1e4).toFixed(2) + '万' + unit;

        // 3. 对转换后的 num 调用 toFixed，确保方法存在
        return num.toFixed(2) + unit;
    }

    function fmtPct(v) {
        if (v == null || isNaN(v)) return '--';
        return (v >= 0 ? '▲ +' : '▼ ') + Number(v).toFixed(2) + '%';

    function fmtPct2(v) {
        if (v == null || isNaN(v)) return '--';
        return Number(v).toFixed(2) + '%';
    }

    // 构建热点板块 HTML 文本，用于 statsBar 的弱势/强势展示
    // 颜色与热力图图例一致：复用 getTreemapColor 色阶，文字根据背景亮度自动取对比色
    function sectorColor(v) {
        if (v == null || isNaN(v)) return {fg: '#c0c0d0', bg: 'rgba(255,255,255,.06)', bd: 'rgba(255,255,255,.2)'};
        const bgHex = getTreemapColor(v);
        const {r, g, b} = hexToRgb(bgHex);
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const fg = lum > 0.6 ? '#1a1a1a' : '#ffffff';
        return {fg, bg: bgHex, bd: bgHex};
    }

    function buildSectorHtml(kwList, label, amountLabel) {
        if (!kwList.length) return '';
        const isStrong = label === '强势';
        const al = amountLabel || '总成交';
        const spans = kwList.map(k => {
            const tt = `${al}: ${fmtAmount(k.volSum || 0)}&#10;${k.matches.map(m => `${m.name.replace(/"/g, '')}  ${fmtPct(m.value)}`).join('&#10;')}`;
            const c = sectorColor(k.avg);
            return `<span class="stat-sector" style="color:${c.fg};background:${c.bg};border:1px solid ${c.bd};" title="${tt}">${k.kw} <b>${fmtPct(k.avg)}</b></span>`;
        }).join('');
        const headColor = isStrong ? '#ffb3a0' : '#9be7b4';
        const head = `<span class="stat-label" style="color:${headColor};">${isStrong ? '▲' : '▼'} ${label}</span>`;
        return `<div class="stat-card">${head}${spans}</div>`;
    }

    // 从指数名称列表中提取高频行业关键词（前3个），返回[{kw, count, avg, volSum, matches}]
    function extractKeywords(items, dict) {
        // 按关键词长度降序排序，这样首次命中就是最长匹配，避免"科技"覆盖"生物科技"
        const sortedDict = [...dict].sort((a, b) => b.length - a.length);
        const map = {}; // kw -> {count, sum, volSum, matches:[]}
        for (const {name, value, amount} of items) {
            for (const kw of sortedDict) {
                if (name.includes(kw)) {
                    if (!map[kw]) map[kw] = {count: 0, sum: 0, volSum: 0, matches: []};
                    map[kw].count++;
                    map[kw].sum += value;
                    map[kw].volSum += (amount || 0);
                    map[kw].matches.push({name, value, amount: amount || 0});
                    break; // 只取最长匹配
                }
            }
        }
        return Object.entries(map)
            .map(([kw, info]) => ({
                kw,
                count: info.count,
                avg: info.sum / info.count,
                volSum: info.volSum,
                matches: info.matches
            }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 3);
    }

    // 提取强势/弱势关键词并插入统计栏卡片数组
    function enrichStatsWithSectors(cards, ranked, topN, sectorDict) {
        const topKws = extractKeywords(ranked.slice(0, topN), sectorDict).sort((a, b) => a.avg - b.avg);
        const botKws = extractKeywords(ranked.slice(-topN), sectorDict).sort((a, b) => a.avg - b.avg);
        const botHtml = buildSectorHtml(botKws, '弱势');
        const topHtml = buildSectorHtml(topKws, '强势');
        // 弱势在左 → 基础统计 → 强势放最右
        const tail = [];
        if (topHtml) tail.push(topHtml);
        const mid = [];
        if (botHtml) mid.push(botHtml);
        return [...mid, '<span class="stat-sep"></span>', ...cards, tail.length ? '<span class="stat-sep"></span>' : '', ...tail];
    }

    function saveSnapshot(date, time) {
        if (!allData.length) return;
        // 检查 localStorage 用量，超阈值时自动清理最早的日期
        const history = getHistory();
        if (!history[date]) history[date] = {};
        history[date][time] = {
            allData: compressData(allData),
            timestamp: Date.now()
        };
        // 估算序列化后大小，超过安全阈值则按日期从旧到新删除
        // 优化：先确定要删除的最早日期集合，最后仅做一次全量序列化（避免 O(n²) 重复 stringify）
        let json = JSON.stringify(history);
        const limitBytes = LSTORAGE_MAX_MB * 1024 * 1024;
        const removePlan = [];
        while (json.length > limitBytes) {
            const dates = Object.keys(history).sort();
            if (dates.length <= 1) break;  // 至少保留今天
            const oldest = dates[0];
            // 如果是当前正在保存的日期，跳过删下一个
            if (oldest === date && dates.length > 1) removePlan.push(dates[1]);
            else removePlan.push(oldest);
            // 在内存模型中直接删除，使下次 stringify 反映最新体积（但不重复 toast）
            if (oldest === date && dates.length > 1) delete history[dates[1]];
            else delete history[oldest];
            json = JSON.stringify(history);
        }
        if (removePlan.length) showToast(`本地存储已满，自动清理了 ${removePlan.length} 个最早日期数据`);
        saveHistory(history);
        updateDateList();
        updateTimeButtons();
        showToast(`已保存 ${date} ${time} 快照`);
    }

    function getSnapshot(date, time) {
        const history = getHistory();
        return history[date] && history[date][time] ? history[date][time] : null;
    }

    function hasSnapshot(date, time) {
        const history = getHistory();
        return !!(history[date] && history[date][time]);
    }

    function isTradingDay() {
        // 周末（周六=6, 周日=0）非交易日
        const day = new Date().getDay();
        if (day === 0 || day === 6) return false;
        // 法定节假日判断
        const todayStr = formatDate(new Date()).replace(/-/g, '');
        return !holidaySet.has(todayStr);
    }

    function isTradeTime() {
        if (!isTradingDay()) return false;
        const now = new Date();
        const h = now.getHours(), m = now.getMinutes();
        const minutes = h * 60 + m;
        // 9:30 - 11:30, 13:30 - 15:00
        return (minutes >= 570 && minutes <= 690) || (minutes >= 780 && minutes <= 930);
    }

    function getCurrentSaveTime() {
        const now = new Date();
        const h = now.getHours(), m = now.getMinutes();
        const minutes = h * 60 + m;
        for (let i = SAVE_TIMES.length - 1; i >= 0; i--) {
            const [th, tm] = SAVE_TIMES[i].split(':').map(Number);
            const tmin = th * 60 + tm;
            if (minutes >= tmin) return SAVE_TIMES[i];
        }
        return null;
    }

    async function autoSaveCheck() {
        if (!isRealtime || !isTradeTime() || isRefreshing) return;
        const now = new Date();
        const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        const totalSeconds = h * 3600 + m * 60 + s;

        for (const st of SAVE_TIMES) {
            const [sh, sm] = st.split(':').map(Number);
            const targetSeconds = sh * 3600 + sm * 60;
            const diff = totalSeconds - targetSeconds;

            // 延迟3秒，窗口5秒（与5s心跳对齐，hasSnapshot 防重复）
            if (3 <= diff && diff < 8) {
                const today = getTradeDate();
                if (!hasSnapshot(today, st)) {
                    // 先拉取最新数据再保存，避免相邻时间点快照内容相同
                    isRefreshing = true;
                    try {
                        await loadAllData();
                        saveSnapshot(today, st);
                        render();
                    } catch (e) {
                        console.error('[自动保存] 数据刷新失败:', e);
                    } finally {
                        isRefreshing = false;
                        setLoading('', false);
                    }
                }
                break; // 一次只处理一个时间点
            }
        }
    }

    function manualSaveNow() {
        // 非实时模式下按钮显示"返回实时"，点击应回到实时而非保存
        if (!isRealtime) {

        const tradeDate = getTradeDate();
        // 对齐到最近的预定义时间点，确保可通过时间按钮访问并更新已有快照
        const st = getCurrentSaveTime() || '15:00';
        saveSnapshot(tradeDate, st);
    }

    function onImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const obj = JSON.parse(e.target.result);
                if (!obj.date || !obj.snapshots) throw new Error('格式错误：缺少 date 或 snapshots');
                const history = getHistory();
                if (!history[obj.date]) history[obj.date] = {};
                for (const [time, snap] of Object.entries(obj.snapshots)) {
                    if (snap.allData) {
                        const isNewFormat = snap.allData.h && snap.allData.r;
                        if (!isNewFormat) {
                            let rawData = snap.allData;
                            if (rawData.length > 0 && rawData[0] && typeof rawData[0] === 'object') {
                                const first = rawData[0];
                                if (!Array.isArray(first)) {
                                    const keys = Object.keys(first);
                                    const hasLongKey = keys.some(k => FIELD_ORDER.includes(k));
                                    if (!hasLongKey) {
                                        const temp = [];
                                        for (const item of rawData) {
                                            const restored = {};
                                            for (const [k, v] of Object.entries(item)) {
                                                restored[k] = v;
                                            }
                                            temp.push(restored);
                                        }
                                        rawData = temp;
                                    }
                                }
                            }
                            snap.allData = compressData(rawData);
                        }
                    }
                    history[obj.date][time] = snap;
                }
                saveHistory(history);
                clearPeriodCache();
                currentDate = obj.date;
                document.getElementById('datePicker').value = obj.date;
                updateDateList();
                updateTimeButtons();
                showToast(`已导入 ${obj.date} 数据`);
                onDateChange(obj.date);
            } catch (err) {
                showToast('导入失败: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    /* ======================== 跨源请求 ======================== */
    // 基于 fetch 的跨源 JSON 请求
    // 东财两个接口（push2delay 实时行情、datacenter 数据中心）均支持 CORS
    // （Access-Control-Allow-Origin: *），统一用 fetch 直接读取 JSON。
    // 注意：需通过 http:// 访问本页（非 file://），否则 origin 为 null 可能被拒绝。

    const DIRECT_FAIL_COOLDOWN = 20 * 1000;
    const directFailState = new Map();  // url → { time, count }
    const directInflight = new Set();   // 正在直连尝试中的 url，防止并发重复直连

    async function _doFetch(fullUrl, timeout) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        try {
            const res = await fetch(fullUrl, {signal: controller.signal});
            if (!res.ok) throw new Error('HTTP ' + res.status);

            // 1. 获取 Content-Type 并统一转为小写，去除多余空格
            const contentType = (res.headers.get('content-type') || '').toLowerCase().trim();

            // 2. 处理 JSON (兼容 application/json, text/json, application/vnd.api+json 等)
            if (contentType.includes('application/json') || contentType.includes('+json')) {
                return await res.json();
            }

            // 3. 处理文本 (如果是 text/ 类型，先拿文本，再尝试 JSON 解析作为兜底)
            if (contentType.includes('text/')) {
                const text = await res.text();
                try {
                    // 服务端有时返回 text/plain 但内容是 JSON，尝试解析
                    return JSON.parse(text);
                } catch (e) {
                    // 解析失败，说明是纯文本，直接返回
                    return text;
                }
            }

            // 4. 处理二进制文件 (图片、文件流等)
            if (contentType.includes('image/') || contentType.includes('octet-stream')) {
                return await res.blob();
            }

            // 5. 兜底：其他未知类型，默认返回原始 Response 对象
            return res;
        } catch (e) {
            if (e.name === 'AbortError') throw new Error('请求超时');
            throw e;
        } finally {
            clearTimeout(timer);
        }
    }

    // degrade 降级模式：
    //   0 - 不降级（默认），直连失败即抛错
    //   1 - 直连失败降级到 BASE_PROXY_PREFIX（http://localhost:5000/proxy），20s 冷却内跳过直连
    //   2 - 直连失败降级到 BASE_PROXY_PLAYWRIGHT_PREFIX（.../proxy/playwright），20s 冷却内跳过直连
    //   3 - 直接走 BASE_PROXY_PREFIX（跳过直连）
    //   4 - 直接走 BASE_PROXY_PLAYWRIGHT_PREFIX（跳过直连）
    // 注：参数顺序保持 (url, params, timeout, degrade) 以兼容既有传 timeout 的调用点。
    // 降级前缀查找表
    const PROXY_PREFIX_MAP = {
        1: BASE_PROXY_PREFIX,
        2: BASE_PROXY_PREFIX + '/playwright',
        3: BASE_PROXY_PREFIX,
        4: BASE_PROXY_PREFIX + '/playwright',
    };

    async function fetchJson(url, params = {}, timeout = 30000, degrade = 0) {
        // 如果 params 有内容才拼接查询字符串
        const queryString = Object.keys(params).length > 0
            ? Object.keys(params).map(k =>
                encodeURIComponent(k) + '=' + encodeURIComponent(params[k])
            ).join('&')
            : '';

        const fullUrl = queryString
            ? url + (url.indexOf('?') >= 0 ? '&' : '?') + queryString
            : url;

        // degrade=0：不降级，直接走直连
        if (degrade === 0) {
            return await _doFetch(fullUrl, timeout);
        }

        const prefix = PROXY_PREFIX_MAP[degrade] || null;
        const proxyFullUrl = prefix + '/' + fullUrl.replace(/^https?:\/\//, '');

        // degrade=3/4：跳过直连，直接走代理
        if (degrade === 3 || degrade === 4) {
            return await _doFetch(proxyFullUrl, timeout);
        }

        // degrade=1/2：直连失败后按失败次数递增冷却时间，避免短时间内反复超时
        const state = directFailState.get(url) || {time: 0, count: 0};
        const recentlyFailed = Date.now() - state.time <= DIRECT_FAIL_COOLDOWN * state.count * state.count;
        if (!recentlyFailed && !directInflight.has(url)) {
            directInflight.add(url);
            try {
                const result = await _doFetch(fullUrl, timeout);
                directFailState.delete(url); // 直连成功，重置失败计数
                directInflight.delete(url);
                return result;
            } catch (e) {
                const newCount = state.count + 1;
                directFailState.set(url, {time: Date.now(), count: newCount});
                console.warn(`直连失败(${newCount}次)，冷却${newCount * newCount * 20}s，${nowStr()}，降级到代理:`, url, e.message);
            } finally {
                directInflight.delete(url);
            }
        }

        return await _doFetch(proxyFullUrl, timeout);
    }

    function parseFundf10Response(text) {
        const match = text.match(/var apidata\s*=\s*(\{.*?\});/s);
        if (match) {
            try {
                return JSON.parse(match[1]);
            } catch (e) {
                return {content: text};
            }
        }
        return {content: text};
    }

    /* ======================== 数据获取 ======================== */
    // 分页获取实时行情（指定市场板块fs，标记交易规则）
    // 接口单次最多返回 100 条（pz>100 也会被截断），且 T+0/T+1 各约 1500 只需分页
    // 采用"水龙头"并行策略：先并发取 pn=1..N，拿到第一页数据后立即追加 pn=N+1，避免串行等待
    // 单个分页请求（返回 diff 数组，失败返回 null 不阻断整体）
    async function fetchSpotPage(fs, tradeRule, page, PAGE_SIZE) {
        const params = {
            pn: String(page), pz: String(PAGE_SIZE), po: '1', np: '1',
            ut: SPOT_UT, fltt: '2', invt: '2', wbp2u: '|0|0|0|web',
            fid: 'f25', fs: fs, fields: SPOT_FIELDS
        };
        try {
            const res = await fetchJson(SPOT_URL, params);
            let diff = res && res.data && res.data.diff;
            if (diff && !Array.isArray(diff)) diff = Object.values(diff);
            if (diff && diff.length) {
                for (const it of diff) it.trade_rule = tradeRule;
            }
            return { diff: diff || [], total: res && res.data && typeof res.data.total === 'number' ? res.data.total : null };
        } catch (err) {
            console.warn(`pn=${page} 请求失败:`, err);
            return { diff: [], total: null };
        }
    }

    async function fetchSpotData(fs, tradeRule, onProgress) {
        const PAGE_SIZE = 100;
        const MAX_PAGES = 60;          // 安全上限，避免异常 total 导致无限翻页
        const CONCURRENCY = 6;        // 单数据源并发分页数（兼顾速度与接口限流）

        // 1) 先发首包，拿到 total 并立即拿到第 1 页数据
        const first = await fetchSpotPage(fs, tradeRule, 1, PAGE_SIZE);
        const all = first.diff.slice();
        let total = first.total;
        if (onProgress) onProgress(all.length, 1);
        // 无 total 或首包不足一页 → 直接结束（兼容异常响应）
        if (total === null || all.length < PAGE_SIZE) return all;

        // 2) 基于 total 计算剩余页数，分批并发拉取（避免无限串行等待）
        const totalPages = Math.min(Math.ceil(total / PAGE_SIZE), MAX_PAGES);
        let nextPage = 2;
        while (nextPage <= totalPages) {
            const batch = [];
            for (let i = 0; i < CONCURRENCY && nextPage <= totalPages; i++, nextPage++) {
                batch.push(fetchSpotPage(fs, tradeRule, nextPage, PAGE_SIZE));
            }
            const results = await Promise.all(batch);
            for (const r of results) {
                if (r.diff.length) {
                    all.push(...r.diff);
                    if (onProgress) onProgress(all.length, 0);
                }
                if (r.total !== null) total = r.total; // 后续响应可能校正 total
            }
            // 任意一批已收满 total 即提前终止
            if (all.length >= total) break;
        }
        return all;
    }

    /**
     * 合并两源数据
     * @param {Array} spotData - 实时行情数据
     * @param {Array} etfData - ETF数据中心数据
     * @param {string} joinType - 连接类型: 'left'(左连接-以ETF为基础) | 'right'(右连接-以实时行情为基础)
     * @returns {Array} 合并后的数据
     */
    function mergeData(spotData, etfData, joinType = 'right') {
        const merged = [];
        if (joinType === 'left') {
            // 左连接：以ETF数据中心为基础
            const spotMap = {};
            for (const s of spotData) spotMap[s.f12] = s;

            for (const e of etfData) {
                const code = e.SECURITY_CODE;
                const s = spotMap[code];
                if (!s) continue; // 无实时行情数据则跳过

                const item = createMergedItem(s, e);
                if ((item.总市值 || 0) >= MIN_SCALE) merged.push(item);
            }
        } else if (joinType === 'right') {
            // 右连接：以实时行情为基础
            const etfMap = {};
            for (const e of etfData) etfMap[e.SECURITY_CODE] = e;

            for (const s of spotData) {
                const code = s.f12;
                const e = etfMap[code]; // 可能为undefined

                const item = createMergedItem(s, e);
                if ((item.总市值 || 0) >= MIN_SCALE) merged.push(item);
            }
        }

        return merged;
    }

    /**
     * 本地指数映射表：当接口未返回指数信息时，从此表补全。
     * 键 = ETF 代码（如 "161130"），值 = { 代码, 名称 }
     * 用户可以在此手动添加缺失的映射。
     */
    const LOCAL_INDEX_MAP = {
        '161130': {指数代码: 'NDX.GI', 指数名称: '纳斯达克100'},
        '161125': {指数代码: 'SPX.GI', 指数名称: '标普500'},
    };

    /**
     * 创建合并后的数据项
     * @param {Object} s - 实时行情数据
     * @param {Object|undefined} e - ETF数据中心数据（可能不存在）
     * @returns {Object} 合并后的数据项
     */
    function createMergedItem(s, e) {
        // 当 e 不存在或指数信息为空时，尝试从本地映射补全
        let idxName = e ? (e.INDEXNAME || '').toString().trim() : '';
        let idxCode = e ? e.DERIVE_INDEX_CODE : '';
        if ((!idxName || !idxCode) && LOCAL_INDEX_MAP[s.f12]) {
            const local = LOCAL_INDEX_MAP[s.f12];
            if (!idxName) idxName = local.指数名称;
            if (!idxCode) idxCode = local.指数代码;
        }
        return {
            代码: s.f12,
            名称: s.f14,
            市场: s.f13,
            交易规则: s.trade_rule,
            最新价: toNum(s.f2),
            涨跌幅: toNum(s.f3),
            涨跌额: toNum(s.f4),
            成交量: toNum(s.f5),
            成交额: toNum(s.f6),
            振幅: toNum(s.f7),
            换手率: toNum(s.f8),
            量比: toNum(s.f10),
            开盘价: toNum(s.f17),
            最高价: toNum(s.f15),
            最低价: toNum(s.f16),
            昨收: toNum(s.f18),
            总市值: toNum(s.f20),
            实时估值: toNum(s.f145),
            折价率: toNum(s.f402),
            // ETF数据字段，若不存在则为null
            近1周: toNum(s.f109),
            近1月: e ? toNum(e.CHANGE_RATE_1M) : null,
            近3月: toNum(s.f24),
            近6月: e ? toNum(e.CHANGE_RATE_6M) : null,
            近1年: e ? toNum(e.CHANGE_RATE_12M) : null,
            今年来: toNum(s.f25),
            指数名称: idxName,
            指数代码: idxCode,
            交易日期: s.f297 || '',
        };
    }

    // 按指数去重：保留总市值最大的一只（用于ETF热力图）
    function dedupByIndex(data) {
        // 先按总市值降序排序，保证首次遇到的就是市值最大的
        const sorted = [...data].sort((a, b) => (b.总市值 || 0) - (a.总市值 || 0));
        const seen = new Set();
        const result = [];
        for (const item of sorted) {
            const idxName = (item.指数名称 || '').trim();
            // 没有指数名称的直接保留，不参与去重
            if (!idxName || !seen.has(idxName)) {
                if (idxName) seen.add(idxName);
                result.push(item);
            }
        }
        return result;
    }

    // 全量获取并组装数据
    async function loadAllData() {
        setLoading('正在获取ETF实时行情（T+0）...', true);
        // 并行获取T+0、T+1实时行情 + 数据中心数据
        const [t0Data, t1Data, etfData] = await Promise.all([
            fetchSpotData(FS_CONFIG['T+0'], 'T+0', n => setLoading(`获取T+0实时行情... ${n}只`, true)),
            fetchSpotData(FS_CONFIG['T+1'], 'T+1', n => setLoading(`获取T+1实时行情... ${n}只`, true)),
            fetchAllEtfData()
        ]);
        setLoading('正在合并数据...', true);
        const spotData = [...t0Data, ...t1Data];
        allData = mergeData(spotData, etfData);
        dedupData = dedupByIndex(allData);
        // 保存一份实时备份，用于从历史模式切回
        realtimeAllData = allData;
        realtimeDedupData = dedupData;
        // 清空周期缓存
        clearPeriodCache();
        document.getElementById('updateTime').textContent = nowStr();
    }

    /* ======================== 统计信息 ======================== */
    function computeStats(data, weightField) {
        // 单次遍历完成全部统计：涨跌平计数、权重字段总额、加权平均涨跌幅
        const wf = weightField || '成交额';
        let rise = 0, fall = 0, flat = 0, totalAmount = 0, sumWeight = 0, sumValue = 0;
        for (const d of data) {
            // 涨跌幅必须有效
            if (d.涨跌幅 == null || isNaN(d.涨跌幅)) continue;
            // 权重字段对应值必须>0，保证计数/总额/加权口径一致
            if (!((d[wf] || 0) > 0)) continue;

            if (d.涨跌幅 > 0) rise++;
            else if (d.涨跌幅 < 0) fall++;
            else flat++;
            // 总额按当前权重字段累加：成交额模式累加成交额，总市值模式累加总市值
            totalAmount += (d[wf] || 0);
            const w = d[wf] || 0;
            if (w > 0) {
                sumWeight += w * d.涨跌幅;
                sumValue += w;
            }
        }
        const avg = sumValue ? sumWeight / sumValue : 0;
        return {total: rise + fall + flat, rise, fall, flat, totalAmount, avg, weightField: wf};
    }

    function statsText(stats, displayCount) {
        const wfLabel = stats.weightField === '总市值' ? '市值' : '成交额';
        const cards = [];
        cards.push(`<div class="stat-card"><span class="stat-pill up">▲ 涨 ${stats.rise}</span><span class="stat-pill down">▼ 跌 ${stats.fall}</span>${stats.flat ? `<span class="stat-pill flat">平 ${stats.flat}</span>` : ''}</div>`);
        cards.push(`<div class="stat-card"><span class="stat-label">总${wfLabel}</span><span class="stat-val" style="color:#00d4ff;">${fmtAmount(stats.totalAmount)}</span></div>`);
        cards.push(`<div class="stat-card"><span class="stat-label">均值(${wfLabel}加权)</span><span class="stat-pill avg">${fmtPct(stats.avg)}</span></div>`);
        if (displayCount != null) cards.push(`<div class="stat-card"><span class="stat-label">显示</span><span class="stat-val">${displayCount} 只</span></div>`);
        return cards;
    }

    /* ======================== ECharts 实例管理 ======================== */
    // 图表容器 ID 前缀集中管理，避免魔法字符串散落各处
    const CHART_PREFIX = {HOLD: 'chartHold', INDEX: 'chartIndex', INTRADAY: 'chartIntraday', FIVE_DAY: 'chart5Day'};
    const echInstances = {};
    // 图表刷新任务表：elId → {fn}，由每分钟第 5 秒的调度器统一驱动
    const refreshTasks = {};

    // 注册图表刷新任务（所有图表统一在每分钟第 5 秒刷新；东财接口每分钟出一条数据，预留 5s 网络延迟）
    function startChartRefresh(refreshInfo) {
        stopChartRefresh(refreshInfo.elId);
        refreshTasks[refreshInfo.elId] = {fn: refreshInfo.fn, secid: refreshInfo.secid};
    }

    function stopChartRefresh(elId) {
        delete refreshTasks[elId];
    }

    // 每分钟第 5 秒的统一调度器句柄，页面卸载时清理以防定时器泄漏
    let heartbeatTimer = null;

    function stopAllChartRefresh() {

    /* ======================== K线数据处理工具 ======================== */
    function splitData(rawData) {
        const categoryData = [], values = [], volumes = [], raws = [];
        for (let i = 0; i < rawData.length; i++) {
            const parts = rawData[i].split(',');
            // 首列是时间，跳过（用索引偏移，避免 shift() 造成的 O(n) 数组搬移）
            const vals = [];
            for (let k = 1; k < parts.length; k++) vals.push(Number(parts[k]));
            categoryData.push(parts[0]);
            values.push(vals);
            raws.push(parts); // 保留原始字符串切片，供 buildOption 复用，避免二次 split
            // 与原逻辑保持一致：开盘 > 收盘（阴线）标记为 1，反之 -1（避免改变成交量柱颜色）
            volumes.push([i, vals[4], vals[0] > vals[1] ? 1 : -1]);
        }
        return {categoryData, values, volumes, raws};
    }

    function calculateMA(dayCount, data) {
        const result = [];
        for (let i = 0; i < data.values.length; i++) {
            if (i < dayCount) {
                result.push('-');
                continue;
            }
            let sum = 0;
            for (let j = 0; j < dayCount; j++) sum += data.values[i - j][1];
            result.push(+(sum / dayCount).toFixed(3));
        }
        return result;
    }

    function calculateMACD(data, short, long, signal) {
        short = short || 12;
        long = long || 26;
        signal = signal || 9;
        const closes = data.values.map(v => v[1]);
        const ema = (arr, period) => {
            const result = [];
            const k = 2 / (period + 1);
            let prev = arr[0];
            result.push(prev);
            for (let i = 1; i < arr.length; i++) {
                prev = arr[i] * k + prev * (1 - k);
                result.push(prev);
            }
            return result;
        };
        const emaShort = ema(closes, short);
        const emaLong = ema(closes, long);
        const dif = closes.map((_, i) => i < long - 1 ? null : emaShort[i] - emaLong[i]);
        const deaRaw = ema(dif.map(v => v === null ? 0 : v), signal);
        const dea = closes.map((_, i) => i < long + signal - 2 ? null : deaRaw[i]);
        const macd = closes.map((_, i) => dif[i] !== null && dea[i] !== null ? 2 * (dif[i] - dea[i]) : null);
        return {dif, dea, macd};
    }

    // 获取分时图的X轴标签和标注
    // 返回 [标注点时间列表, 标注点映射]
    function getMinuTimeAxis(rawTimes) {
        const times = rawTimes.map(t => {
            const parts = t.split(' ');
            return parts[1] || parts[0];
        });
        const markTimes = [];
        const markMap = {};

        // 根据数据总量四等分，取中间 3 个点
        const len = times.length;
        if (len > 0) {
            // 分成 4 段，取第 1、2、3 段的结尾索引
            const indices = [
                Math.round(len * 1 / 4),
                Math.round(len * 2 / 4),
                Math.round(len * 3 / 4)
            ];

            indices.forEach(idx => {
                if (idx < len) {
                    const t = times[idx];
                    markTimes.push(t);
                    markMap[t] = t;
                }
            });
        }

        return [markTimes, markMap];
    }

    const cmpColor = (val, fmt, pre) => {
        if (val == null) return '--';
        if (pre == null) return fmt;
        const cls = val > pre ? '#e74c3c' : val < pre ? '#2ecc71' : '';
        return cls ? `<span style="color:${cls}">${fmt}</span>` : fmt;

    // 批量查询多个 secid，返回 Map<secid, quoteObj>（secidList 可传字符串或数组）
    async function fetchQuoteBatch(secidList) {
        const arr = Array.isArray(secidList) ? secidList : (secidList ? [secidList] : []);
        if (!arr.length) return new Map();
        const res = await fetchJson(ULIST_URL, {
            secids: arr.join(','),
            fltt: '2',
            fields: SPOT_FIELDS
        });
        const diff = (res && res.data && res.data.diff) || [];
        const items = Array.isArray(diff) ? diff : Object.values(diff);
        const map = new Map();
        for (const item of items) {
            if (item.f13 === undefined || item.f12 === undefined) continue;
            // 使用 f13(市场) 和 f12(代码) 拼接生成标准 secid
            const key = `${item.f13}.${item.f12}`;
            const q = normalizeQuote(item);
            map.set(key, q);
        }
        return map;
    }

    function normalizeQuote(item) {
        return {
            price: toNum(item.f2),
            chgPct: toNum(item.f3),
            chgAmt: toNum(item.f4),
            amount: toNum(item.f6),
            amplitude: toNum(item.f7),
            open: toNum(item.f17),
            high: toNum(item.f15),
            low: toNum(item.f16),
            preClose: toNum(item.f18),
            name: item.f14,
            code: item.f12,
            nav: toNum(item.f145),
            turnover: item.f8,
            mcap: item.f20,
            ytd: toNum(item.f25),
            weekPct: toNum(item.f109),
            premium: toNum(item.f402),
            iopv: toNum(item.f145)

    }

    // 公用抬头渲染：prefix 为元素 id 前缀（'dp'/'idx'），opts 控制特数字段
    function applyQuoteHeader(q, prefix, opts) {
        if (!q) return;
        opts = opts || {};
        const {
            price, chgPct, chgAmt, amount, amplitude, open, high, low, preClose,
            name, code, turnover, mcap, premium
        } = q;
        const p = prefix;

        // 通用字段（价格类：cmpColor 用昨收作基准；涨跌幅：用 0 作基准）
        setHtml(p + 'Chg', cmpColor(chgPct, fmtPct2(chgPct), 0));

        let displayPrice = price;
        if (opts.priceZeroFallback) displayPrice = (price === 0 && preClose > 0) ? preClose : price;
        setHtml(p + 'Price', cmpColor(displayPrice, fmtPrice(displayPrice), preClose));

        setHtml(p + 'Open', cmpColor(open, fmtPrice(open), preClose));
        setHtml(p + 'High', cmpColor(high, fmtPrice(high), preClose));
        setHtml(p + 'Low', cmpColor(low, fmtPrice(low), preClose));
        setText(p + 'Amplitude', fmtPct2(amplitude));
        setText(p + 'Close', fmtPrice(preClose));
        setText(p + 'Amount', fmtAmount(amount));
        setText(p + 'Turnover', fmtPct2(turnover));
        setText(p + 'Mcap', fmtAmount(mcap));

        // 详情（ETF）特有：溢价率取负显示
        if (opts.withPremium) {
            const dpPrem = premium != null && !isNaN(premium) ? -premium : null;
            if (dpPrem !== null) setHtml(p + 'Premium', cmpColor(dpPrem, fmtPct2(dpPrem), 0));
        }
        // 指数特有：名称/代码
        if (opts.withNameCode) {
            setText(p + 'Name', truncLabel(name));
            const nameEl = document.getElementById(p + 'Name');
            if (nameEl) nameEl.title = name || '';
            setText(p + 'Code', code);
        }
        // 指数特有：涨跌额（颜色以涨跌额自身符号为基准）
        if (opts.withChgAmt) {
            setHtml(p + 'Change', cmpColor(chgAmt, fmtPct2(chgAmt), chgAmt));
        }
    }

    function getQuoteId(code) {
        if (!code) return null
        // 1. 海外主要指数/恒生主要指数（走 100. 前缀）
        const overseasIdx = {
            'NDX.GI': '100.NDX100',
            'N225.GI': '100.N225',
            'GDAXI.GI': '100.GDAXI',
            'SPX.GI': '100.SPX',
            'DJIA.GI': '100.DJIA',
            'BVSP.GI': '100.BVSP',
            'FCHI.GI': '100.FCHI',
            'FISAULMU.GI': '100.FISAULMU',
            'HSI.HI': '100.HSI',      // 恒生指数本身走 100.
            'HSCEI.HI': '100.HSCEI',    // 恒生国企指数也走 100.
        };
        if (overseasIdx[code]) return overseasIdx[code];

        const [symbolRaw, market] = code.split('.');
        let symbol = symbolRaw;

        // 2. 截掉 CNY00 尾缀（人民币计价衍生品）
        if (symbol.endsWith('CNY00')) {
            symbol = symbol.slice(0, -5);
        }

        // 3. 特殊 CSI 指数（走 125. 前缀）
        const specialCSI = {
            'H11153': '125.H11153',
            'CES100': '125.CES100',
        };
        if (market === 'CSI' && specialCSI[symbol]) {
            return specialCSI[symbol];
        }

        // 4. 市场前缀映射
        const marketMap = {
            SH: '1',   // 沪A
            SZ: '0',   // 深A
            CSI: '2',  // 中证/沪深指数
            GI: '251', // 国际（非海外主要指数）
            SGE: '118',// 上海黄金
            HI: '124', // 港股（恒生子指数等）
        };

        // 5. 处理 SH 市场的特殊情况
        if (market === 'SH') {
            // 5a. 科创指数（9501开头）→ 2.
            if (symbol.startsWith('9501')) {
                return '2.' + symbol;
            }
            // 5b. 上证指数（H开头）→ 2.（如 H50069.SH → 2.H50069）
            if (/^H\d+/.test(symbol)) {
                return '2.' + symbol;
            }
        }

        // 6. 处理 HI 市场：除 HSI/HSCEI 外，其余走 124.
        // （已在 overseasIdx 中处理了 HSI/HSCEI，此处正常走 marketMap）

        const prefix = marketMap[market];
        if (!prefix) {
            // 未知 market 尝试直接返回 null（可扩展日志）
            return null;
        }

        return prefix + '.' + symbol;
    }

     * 是否允许刷新：沪深标的需要交易时间，其他直接允许
     * @param {string} secid
     * @returns {boolean}

    // 批量刷新详情 + 指数抬头：合并为一次 ulist 请求
    let quoteMap = new Map();

    async function refreshBothQuotes() {
        const tasks = [];
        // 有detailSecid标的：沪深标的需满足交易时间，非沪深直接放行；缓存quoteMap为空时强制获取一次数据
        const detailOpen = document.getElementById('detailPanel')?.classList.contains('open');
        if (detailSecid && detailOpen && (canDoMarketRefresh(detailSecid) || !quoteMap.get(detailSecid))) {
            tasks.push({secid: detailSecid, kind: 'detail'});
        }

        const indexOpen = document.getElementById('indexPanel')?.classList.contains('open');
        if (indexOpen && (currentIndexSecid || currentIndexCode)) {
            if (!currentIndexSecid) currentIndexSecid = getQuoteId(currentIndexCode);
            if (currentIndexSecid && canDoMarketRefresh(currentIndexSecid)) {
                tasks.push({secid: currentIndexSecid, kind: 'index'});
            }
        }
        if (!tasks.length) return;

        try {
            const secidList = tasks.map(t => t.secid);
            quoteMap = await fetchQuoteBatch(secidList);

            for (const t of tasks) {
                const q = quoteMap.get(t.secid);
                if (!q) continue;
                if (t.kind === 'detail') applyQuoteHeader(q, 'dp', {priceZeroFallback: true, withPremium: true});
                else if (t.kind === 'index') applyQuoteHeader(q, 'idx', {withNameCode: true, withChgAmt: true});
            }
        } catch (_) {
        }
    }

    function resizePanelCharts(prefix) {
        requestAnimationFrame(() => {
            setTimeout(() => {
                for (const key in echInstances) {
                    if (key.startsWith(prefix)) {
                        const dom = document.getElementById(key);
                        if (dom && dom.offsetParent !== null) {

    // 按 tab 索引加载对应图表（分时/五日/K线）；elIdPrefix 区分面板：chart/chartIndex/chartHold
    function loadChartByTab(idx, elIdPrefix, secid, skipHeaderUpdate, infoPrefix) {
        const cfg = TAB_CHART_CONFIG[idx];
        if (!cfg) return;
        if (!skipHeaderUpdate) {
            refreshBothQuotes();
        }
        if (cfg.type === 'trends') {
            const elId = elIdPrefix + (cfg.ndays === 1 ? 'Intraday' : '5Day');
            loadTrends(secid, elId, cfg.ndays);
        } else {
            const suffix = KLT_SUFFIX[cfg.klt];
            const infoElId = infoPrefix ? infoPrefix + 'Kline' + suffix : undefined;
            const elId = elIdPrefix + 'Kline' + suffix;
            loadKline(cfg.klt, init_kline_size, elId, secid, infoElId);
        }
    }

    function switchIndexTab(idx, fromDetail = false, skipHeaderUpdate = false) {

        toggleTabActive('.index-body > div', '.index-tabs button', idx);

    async function parseHoldingsHtml(content, curyear) {
        // ---------- 只取第一个 <table> 的内容（即最新季度）----------
        const firstTableMatch = content.match(/<table[^>]*>[\s\S]*?<\/table>/);
        if (!firstTableMatch) return [];
        const tableHtml = firstTableMatch[0];

        // 提取该 table 内所有 td 的纯文本
        const tdReg = /<td[^>]*>([\s\S]*?)<\/td>/gi;
        const cells = [];
        let match;
        while ((match = tdReg.exec(tableHtml))) {
            const cellText = match[1].replace(/<[^>]+>/g, '').trim();
            cells.push(cellText);
        }

        // 表固定 9 列
        const ROW_COL_COUNT = 9;
        const holdings = [];
        for (let i = 0; i + ROW_COL_COUNT <= cells.length; i += ROW_COL_COUNT) {
            holdings.push({
                securityCode: cells[i + 1],
                securityName: cells[i + 2],
                price: toNum(cells[i + 3]),
                changePercent: toNum(cells[i + 4]),
                ratio: toNum(cells[i + 6]),
                holdShares: toNum(cells[i + 7]),
                holdValue: toNum(cells[i + 8]),
                secid: ''
            });
        }

        // ---------- 日期处理（只从第一个 .box 块中提取）----------
        const firstBoxMatch = content.match(/<div class="boxitem w790">[\s\S]*?<\/div>\s*<\/div>/);
        const boxHtml = firstBoxMatch ? firstBoxMatch[0] : content;

        const pureText = boxHtml.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ');
        const dateReg = /截止至[：:]\s*(\d{4}-\d{2}-\d{2})/;
        const quarterReg = /(\d{4})年(\d)季度/;
        const dateMatch = pureText.match(dateReg);
        const periodMatch = pureText.match(quarterReg);

        const dateEl = document.getElementById('holdingsDate');
        const titleEl = document.getElementById('holdingsTitle');

        if (dateMatch?.[1]) {
            dateEl.textContent = `截止至: ${dateMatch[1]}`;
            titleEl.textContent = titleEl.textContent.replace(/\s*\d{4}Q\d\s*/g, '');
        } else if (curyear && periodMatch?.[2]) {
            dateEl.textContent = '';
            titleEl.textContent = titleEl.textContent.replace(/\s*\d{4}Q\d\s*/g, '') + ` ${curyear}Q${periodMatch[2]}`;
        } else {
            dateEl.textContent = '';
            titleEl.textContent = titleEl.textContent.replace(/\s*\d{4}Q\d\s*/g, '');
        }

        // ---------- gpdmList 匹配（只从第一个 .box 中查找）----------
        const gpdmMatch = boxHtml.match(/id='gpdmList'>([^<]+)/);
        const gpdmList = gpdmMatch
            ? gpdmMatch[1].split(',').map(s => s.trim()).filter(Boolean)
            : [];

        for (const item of holdings) {
            const {securityCode, securityName} = item;
            if (!securityCode) continue;
            const targetSecid = gpdmList.find(str => str.includes(securityCode));
            if (targetSecid) {
                item.secid = targetSecid;
            } else {
                // 根据 name 去搜索，返回结果 匹配code 获取 QuoteID
                try {
                    const data = await search(securityName);
                    if (data.Status === 0 && data.Data && data.Data.length > 0) {
                        const target = data.Data.find(d => d.Code === securityCode);
                        if (target) {
                            item.secid = target.QuoteID;
                        }
                    }
                } catch (e) {
                    console.warn(`根据 ${securityName} 去搜索，返回结果 匹配code 获取 QuoteID 失败:`, securityName, e.message);
                }
            }
        }

        return holdings;
    }

    async function fetchIndexConstituents(indexCode) {
        const codes = [];
        let page = 1;
        const maxPages = 50;

        while (page <= maxPages) {
            const params = {
                reportName: 'RPT_INDEX_COMPONENT',
                columns: 'ALL',
                filter: `(INDEX_CODE="${indexCode}")`,
                pageNumber: page,
                pageSize: 50,
                source: 'WEB',
                client: 'WEB'
            };
            const res = await fetchJson(DC_WEB_URL, params);
            const data = res?.result?.data || [];
            if (!data.length) break;
            codes.push(...data.map(item => String(item.SECURITY_CODE || '').trim()).filter(Boolean));
            if (page >= Number(res?.result?.pages || 1)) break;
            page++;
        }

        return [...new Set(codes)];
    }

    function buildHoldingsFromConstituents(codes) {
        return codes.map(code => ({
            securityCode: code,
            securityName: '',
            price: null,
            changePercent: null,
            ratio: null,
            holdShares: null,
            holdValue: null,
            secid: inferSecId(code)
        }));
    }

    function inferSecId(code) {
        const n = code.trim();
        if (/^[A-Za-z]+$/.test(n)) {
            return `105.${n.toUpperCase()}`;
        }
        if (n.length > 0 && n.length <= 5 && !/^\d{6}$/.test(n)) {
            return `116.${n.padStart(5, '0')}`;
        }
        return `${n.startsWith('6') ? '1' : '0'}.${n}`;
    }

    function sortHoldings(holdings) {

            if (field === 'name') {
                return asc ? va.localeCompare(vb) : vb.localeCompare(va);

            return asc ? (va - vb) : (vb - va);
        });
        return sorted;
    }

    /**
     * 根据时间段生成逐分钟时分列表(HH:mm)，兼容跨天时段
     * @param {Array} periods 时间段数组，每项包含 b(开始时间)、e(结束时间)
     * 时间格式：yyyyMMddHHmmss（数字/字符串均可）
     * @returns {string[]} 时分数组，示例：["23:50", "23:51", ...]
     */
    function generateFullDayTimeSlots(periods) {
        // 一天总分钟数 24 * 60
        const ONE_DAY_MINUTES = 1440;
        const timeSlots = [];

        periods.forEach(period => {
            // 强制转为字符串，避免数字/空值导致 slice 报错
            const startTimeStr = String(period.b || '');
            const endTimeStr = String(period.e || '');

            // 时间串长度不足，直接跳过无效数据
            if (startTimeStr.length < 12 || endTimeStr.length < 12) return;

            // 解析开始时分，转换为当日累计分钟数
            const startHour = Number(startTimeStr.slice(8, 10));
            const startMinute = Number(startTimeStr.slice(10, 12));
            let startTotalMin = startHour * 60 + startMinute;

            // 解析结束时分，转换为当日累计分钟数
            const endHour = Number(endTimeStr.slice(8, 10));
            const endMinute = Number(endTimeStr.slice(10, 12));
            let endTotalMin = endHour * 60 + endMinute;

            // 结束时间小于开始时间 = 跨天，追加一天分钟数
            if (endTotalMin < startTotalMin) {
                endTotalMin += ONE_DAY_MINUTES;
            }

            // 逐分钟生成 HH:mm 格式时间
            for (let currentMin = startTotalMin; currentMin <= endTotalMin; currentMin++) {
                const currDayMin = currentMin % ONE_DAY_MINUTES;
                const hour = Math.floor(currDayMin / 60).toString().padStart(2, '0');
                const minute = (currDayMin % 60).toString().padStart(2, '0');
                timeSlots.push(`${hour}:${minute}`);
            }
        });

        return timeSlots;
    }
